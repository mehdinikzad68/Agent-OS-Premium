<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 720" role="img" aria-labelledby="title desc">
<title id="title">Agent OS: planning is separate from authority</title>
<desc id="desc">Proposed architecture, not implemented. A Next.js dashboard issues commands to a deterministic control service. The service requests proposals from a restricted Hermes planner, validates approvals and persists jobs, then dispatches through runtime-specific adapters to DSH or Antigravity. A memory service separates operational state, shared knowledge, and immutable artifacts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="Segoe UI,Arial,sans-serif" fill="#0C447C">
<text x="40" y="35" font-size="15" font-weight="500">Mission Control: proposed authority boundaries</text>
<rect x="190" y="60" width="300" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="79" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500">Next.js dashboard</text>
<text x="340" y="98" text-anchor="middle" dominant-baseline="central" font-size="12">Missions, approvals, evidence</text>
<path d="M340 116V170" fill="none" stroke="#185FA5" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="351" y="149" font-size="12">Commands + durable events</text>
<rect x="40" y="180" width="180" height="76" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="201" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500">Hermes planner</text>
<text x="130" y="224" text-anchor="middle" dominant-baseline="central" font-size="12">Proposals, not execution</text>
<text x="130" y="242" text-anchor="middle" dominant-baseline="central" font-size="12">Approved context only</text>
<rect x="300" y="180" width="340" height="76" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="470" y="201" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Deterministic control service</text>
<text x="470" y="224" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Validate, authorize, persist, dispatch</text>
<text x="470" y="242" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Only authority for job transitions</text>
<path d="M220 218H290" fill="none" stroke="#185FA5" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M470 256V310" fill="none" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="482" y="290" font-size="12" fill="#085041">Scoped approval</text>
<rect x="300" y="320" width="340" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="470" y="340" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Versioned runtime adapters</text>
<text x="470" y="359" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Normalize capabilities, events, outcomes</text>
<path d="M470 376V406H360V434M470 406H560V434" fill="none" stroke="#0F6E56" stroke-width="0.5" marker-end="url(#arrow)"/>
<rect x="280" y="444" width="160" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="360" y="464" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500">DSH worker</text>
<text x="360" y="483" text-anchor="middle" dominant-baseline="central" font-size="12">Code + test evidence</text>
<rect x="480" y="444" width="160" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="560" y="464" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500">Antigravity worker</text>
<text x="560" y="483" text-anchor="middle" dominant-baseline="central" font-size="12">Explicit specialist role</text>
<rect x="40" y="320" width="180" height="180" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="130" y="345" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Memory service</text>
<text x="130" y="381" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">SQLite: operational truth</text>
<text x="130" y="414" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Obsidian: curated knowledge</text>
<text x="130" y="447" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Artifacts: versioned evidence</text>
<text x="130" y="479" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Snapshots + controlled writes</text>
<path d="M130 256V310" fill="none" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<path d="M220 348H290" fill="none" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="4 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="40" y="550" width="600" height="78" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="573" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500">Execution and data boundary</text>
<text x="340" y="596" text-anchor="middle" dominant-baseline="central" font-size="12">Deny unapproved egress; restrict paths, credentials and child processes.</text>
<text x="340" y="614" text-anchor="middle" dominant-baseline="central" font-size="12">A working directory, prompt rule or protocol is not a sandbox.</text>
<text x="40" y="663" font-size="12">Solid: command/event channels. Dashed: controlled context access.</text>
<text x="40" y="684" font-size="12">Local tool versions and enforceable isolation still need verification.</text>
<text x="40" y="700" font-size="11">Architecture only · 21 September 2026 · No runtime connected</text>
</g>
</svg>