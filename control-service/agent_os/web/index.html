<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent OS — Mission Control</title>
<script src="/three.min.js"></script>
<style>
  :root {
    --bg: #06050f; --panel: rgba(22, 17, 46, 0.65); --panel2: rgba(12, 9, 28, 0.72); --panel-active: rgba(22, 17, 46, 0.9);
    --border: rgba(196,178,255,.14); --border-focus: #7cc8ff;
    --text: #efe9ff; --text-bright: #ffffff; --muted: #a79ecb;
    --accent: #7cc8ff; --ok: #86e8a8; --warn: #ff9a52; --bad: #ff6b81; --info: #a79ecb;
    --code-bg: rgba(0,0,0,0.5);
  }
  .card, .top-bar { backdrop-filter: blur(14px); box-shadow: 0 20px 60px -30px rgba(0,0,0,0.7), inset 0 1px rgba(255,255,255,0.04); background: linear-gradient(180deg, var(--panel), var(--panel2)); }
  body { background: radial-gradient(60% 40% at 78% 8%,rgba(255,150,80,.1),transparent 70%),radial-gradient(50% 50% at 10% 90%,rgba(120,70,220,.18),transparent 70%),radial-gradient(40% 30% at 50% 50%,rgba(255,170,90,.05),transparent 70%),var(--bg); }
  .nebula { position:fixed; inset:0; pointer-events:none; z-index:-2; overflow:hidden; }
  .nebula:before { content:""; position:absolute; left:-20%; right:-20%; top:20%; height:60%; transform:rotate(-24deg); background:radial-gradient(40% 30% at 30% 50%,rgba(255,205,150,.13),transparent 70%),radial-gradient(35% 26% at 62% 46%,rgba(206,130,255,.14),transparent 70%),radial-gradient(60% 18% at 50% 52%,rgba(255,235,210,.07),transparent 70%),radial-gradient(30% 10% at 45% 54%,rgba(10,6,20,.55),transparent 80%); filter:blur(12px); animation:drift 60s ease-in-out infinite alternate; }
  @keyframes drift{to{transform:rotate(-20deg) translate(3%)}}
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  }
  .top-bar {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-size: 16px; margin: 0; }
  .top-bar-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .project-selector { width: 180px; }
  .executor-chips { display: flex; gap: 6px; }
  .executor-chip {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    background: var(--panel2); border: 1px solid var(--border); font-size: 11px;
  }
  .executor-chip.active { border-color: var(--ok); color: var(--ok); }
  .layout-3col {
    display: grid; grid-template-columns: 280px 1fr 400px; gap: 14px;
    padding: 14px 16px; height: calc(100vh - 60px);
  }
  @media (max-width: 1200px) { .layout-3col { grid-template-columns: 240px 1fr 340px; } }
  @media (max-width: 900px) { .layout-3col { grid-template-columns: 1fr; height: auto; } }
  .pane-left, .pane-center, .pane-right {
    overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .card h3 { font-size: 12px; margin: 14px 0 8px; color: var(--muted); }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { padding: 8px 10px; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  .item:hover { border-color: var(--accent); }
  button.item { text-align: start; width: 100%; font: inherit; color: inherit; display: block; cursor: pointer; }
  .item .t { display: block; font-weight: 600; }
  .item .m { display: block; color: var(--muted); font-size: 12px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .b-draft { background: #30363d; }
  .b-active { background: #0d419d33; color: var(--accent); }
  .b-proposed { background: #30363d; color: var(--muted); }
  .b-awaiting_approval { background: #9e6a0333; color: var(--warn); }
  .b-approved { background: #0d419d33; color: var(--accent); }
  .b-running { background: #0d419d33; color: var(--accent); }
  .b-dispatched { background: #0d419d33; color: var(--accent); }
  .b-completed_verified { background: #2ea04333; color: var(--ok); }
  .b-completed_unverified { background: #d2992233; color: var(--warn); }
  .b-failed { background: #f8514933; color: var(--bad); }
  .b-interrupted_unknown { background: #a371f733; color: var(--info); }
  .b-closed { background: #30363d; }
  .feed { max-height: 420px; overflow-y: auto; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .feed .row { padding: 4px 6px; border-bottom: 1px solid var(--border); }
  .feed .seq { color: var(--muted); }
  .feed .kind { color: var(--accent); }
  .feed .ts { color: var(--muted); float: left; }
  .tech { direction: ltr; unicode-bidi: isolate; text-align: left;
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 12px; word-break: break-all; }
  pre.detail { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: var(--panel2); padding: 10px; border-radius: 6px; }
  .row-inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .pill { display:inline-block; padding: 2px 8px; border-radius: 10px; background: var(--panel2); border:1px solid var(--border); font-size: 12px; }
  #toast { position: fixed; bottom: 16px; left: 16px; background: var(--panel); border:1px solid var(--border); padding: 10px 14px; border-radius: 8px; display:none; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); }
  .tab-bar { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .tab-btn {
    background: var(--panel2); border: 1px solid var(--border); border-bottom: none;
    border-radius: 6px 6px 0 0; padding: 6px 12px; cursor: pointer;
    font-size: 12px; color: var(--muted); font-family: inherit;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { background: var(--panel); color: var(--text-bright); border-color: var(--accent); }
  .tab-content { flex: 1; overflow-y: auto; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .approval-card {
    border: 1px solid var(--warn); border-radius: 8px; padding: 12px;
    background: var(--panel2); margin-bottom: 8px;
  }
  .approval-card .approval-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    color: var(--warn); font-weight: 600; font-size: 13px;
  }
  .evidence-panel { padding: 8px 0; }
  .evidence-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .evidence-tab {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 10px; cursor: pointer; font-size: 11px; color: var(--muted);
    font-family: inherit;
  }
  .evidence-tab.active { background: var(--panel-active); color: var(--text-bright); border-color: var(--accent); }
  .evidence-content { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .evidence-content pre {
    background: var(--code-bg); padding: 8px; border-radius: 4px;
    overflow-x: auto; direction: ltr; text-align: left; white-space: pre-wrap;
  }
  .evidence-metrics { display: flex; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .evidence-metric { font-size: 11px; color: var(--muted); }
  .evidence-metric b { color: var(--text); }
  .feed-controls { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .feed-filter { width: 120px; }
  .feed-follow { font-size: 11px; }
  .diagnostics-tray {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
    border-top: 1px solid var(--border); z-index: 20; max-height: 200px; overflow: hidden;
    transition: max-height 0.2s ease;
  }
  .diagnostics-tray.collapsed { max-height: 32px; }
  .tray-header {
    display: flex; align-items: center; gap: 10px; padding: 6px 16px;
    font-size: 12px; color: var(--muted); cursor: pointer;
  }
  .tray-content { padding: 0 16px 10px; overflow-y: auto; }
  input, button, select, textarea {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  button { cursor: pointer; }
  .langsel { color: var(--muted); font-size: 12px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #06121f; border-color: var(--accent); font-weight: 600; }
  button.ok { background: var(--ok); color: #04120a; border-color: var(--ok); }
  button.bad { background: var(--bad); color: #1c0605; border-color: var(--bad); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="nebula"></div>
<canvas id="bg-canvas" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;"></canvas>
<header class="top-bar">
  <div class="brand">
    <h1>🛰️ Agent OS — Mission Control</h1>
    <span class="muted" id="conn" data-i18n="conn.connecting"></span>
  </div>
  <div class="top-bar-controls">
    <select id="project-selector" class="project-selector" aria-label="Project">
      <option value="">—</option>
    </select>
    <div class="executor-chips">
      <span class="executor-chip" id="chip-hermes">Hermes</span>
      <span class="executor-chip" id="chip-docker">Docker</span>
      <span class="executor-chip" id="chip-subprocess">Subprocess</span>
    </div>
    <span class="spacer"></span>
    <input id="token" type="password" data-i18n-attr="placeholder:auth.tokenPlaceholder" placeholder="" style="width:220px">
    <button id="btn-connect" class="primary" data-i18n="auth.connect"></button>
    <label class="langsel" for="lang-select" data-i18n="ui.language"></label>
    <select id="lang-select" aria-label="Language">
      <option value="en">English</option>
      <option value="fa">فارسی</option>
    </select>
  </div>
</header>

<div class="layout-3col">
  <aside class="pane-left">
    <div class="card">
      <h2 data-i18n="sys.status"></h2>
      <div id="status" class="muted">—</div>
    </div>
    <div class="card">
      <h2 data-i18n="ui.projects"></h2>
      <form id="proj-form">
        <div class="row-inline">
          <input id="proj-name" aria-label="" placeholder="">
          <input id="proj-root" aria-label="" placeholder="" style="flex:1">
          <select id="proj-env" aria-label="">
            <option value="wsl">wsl</option>
            <option value="windows">windows</option>
          </select>
          <button class="ok" id="proj-add" type="submit"></button>
        </div>
      </form>
      <div id="proj-list" class="list"></div>
      <p id="proj-msg" class="muted"></p>
    </div>
    <div class="card">
      <h2 data-i18n="mission.new"></h2>
      <div class="row-inline">
        <input id="new-mission" data-i18n-attr="placeholder:mission.titlePlaceholder" placeholder="" style="flex:1">
        <button id="btn-mission" class="primary" data-i18n="mission.create"></button>
      </div>
      <h3 data-i18n="mission.list" style="margin-top:12px"></h3>
      <div id="missions" class="list"></div>
    </div>
    <div class="card">
      <h2 data-i18n="ui.tools"></h2>
      <div class="muted" data-i18n="ui.toolsSafety"></div>
      <div class="row-inline" style="margin-top:8px">
        <button class="ok" id="tool-discover" type="button" data-i18n="ui.toolsDiscover"></button>
        <span class="muted" id="tool-msg"></span>
      </div>
      <div id="tool-discovery" class="list"></div>
      <h3 data-i18n="ui.toolsRegistry" style="margin-top:14px"></h3>
      <div id="tool-list" class="list"></div>
    </div>
  </aside>

  <main class="pane-center">
    <div class="card">
      <h2 data-i18n="mission.detail"></h2>
      <div id="mission-detail" class="muted" data-i18n="mission.selectOne"></div>
      <div id="jobs" class="list" style="margin-top:10px"></div>
    </div>
    <div class="card" id="job-card" style="display:none">
      <h2 data-i18n="job.detail"></h2>
      <div id="job-detail" class="muted">—</div>
    </div>
  </main>

  <aside class="pane-right">
    <div class="tab-bar" role="tablist">
      <button class="tab-btn active" data-tab="approvals" id="tab-approvals" data-i18n="approvals.box"></button>
      <button class="tab-btn" data-tab="evidence" id="tab-evidence" data-i18n="job.evidence"></button>
      <button class="tab-btn" data-tab="feed" id="tab-feed" data-i18n="feed.title"></button>
      <button class="tab-btn" data-tab="observed" id="tab-observed" data-i18n="ui.observedTimeline"></button>
      <button class="tab-btn" data-tab="workflows" id="tab-workflows" data-i18n="ui.workflows"></button>
      <button class="tab-btn" data-tab="graphics" id="tab-graphics" data-i18n="graphics.title"></button>
</div>
    <div class="tab-content">
      <div class="tab-panel active" id="panel-approvals">
        <div id="approvals" class="list"></div>
      </div>
      <div class="tab-panel" id="panel-evidence">
        <div id="evidence-panel"></div>
      </div>
      <div class="tab-panel" id="panel-feed">
        <div class="feed-controls">
          <select id="feed-filter" class="feed-filter" aria-label="Filter">
            <option value="all">All</option>
            <option value="info">Info</option>
            <option value="warn">Warning</option>
            <option value="error">Error</option>
            <option value="security">Security</option>
          </select>
          <button id="feed-follow" class="feed-follow" type="button">Follow Live</button>
        </div>
        <div id="feed" class="feed">—</div>
      </div>
      <div class="tab-panel" id="panel-observed">
        <div class="muted" data-i18n="ui.observedSafety"></div>
        <div class="row-inline" style="margin-top:8px">
          <button class="ok" id="obs-ingest" type="button" data-i18n="ui.observedIngest"></button>
          <span class="muted" id="obs-msg"></span>
        </div>
        <div class="muted" id="obs-state" style="margin-top:8px"></div>
        <div id="obs-list" class="list"></div>
      </div>
      <div class="tab-panel" id="panel-workflows">
        <div class="card">
          <h2 data-i18n="wf.create"></h2>
          <div class="row-inline" style="margin-bottom:8px">
            <input id="wf-title" data-i18n-attr="placeholder:wf.titlePlaceholder" placeholder="" style="flex:1">
          </div>
          <div class="row-inline" style="margin-bottom:8px">
            <input id="wf-desc" data-i18n-attr="placeholder:wf.descPlaceholder" placeholder="" style="flex:1">
          </div>
          <div class="row-inline" style="margin-bottom:8px">
            <input id="wf-executor" data-i18n-attr="placeholder:wf.executorPlaceholder" placeholder="" style="flex:1">
          </div>
          <div class="row-inline" style="margin-bottom:8px">
            <textarea id="wf-nodes" data-i18n-attr="placeholder:wf.nodesPlaceholder" placeholder="" style="flex:1;min-height:120px;font-family:monospace;font-size:12px"></textarea>
          </div>
          <button class="primary" id="wf-create" type="button" data-i18n="wf.createBtn"></button>
          <span class="muted" id="wf-msg" style="margin-left:8px"></span>
        </div>
        <div class="card">
          <h2 data-i18n="wf.list"></h2>
          <div id="wf-list" class="list"></div>
        </div>
        <div class="card" id="wf-run-card" style="display:none">
          <h2 data-i18n="wf.run"></h2>
          <div id="wf-run-info" class="muted" style="margin-bottom:8px"></div>
          <div class="row-inline" style="margin-bottom:8px">
            <textarea id="wf-run-inputs" data-i18n-attr="placeholder:wf.inputsPlaceholder" placeholder="" style="flex:1;min-height:80px;font-family:monospace;font-size:12px"></textarea>
          </div>
          <button class="ok" id="wf-run" type="button" data-i18n="wf.runBtn"></button>
          <span class="muted" id="wf-run-msg" style="margin-left:8px"></span>
        </div>
        <div class="card" id="wf-exec-card" style="display:none">
          <h2 data-i18n="wf.execution"></h2>
          <div id="wf-exec-detail" class="muted"></div>
        </div>
      </div>
      <div class="tab-panel" id="panel-graphics">
        <div class="card">
          <h2 data-i18n="graphics.create"></h2>
          <div class="row-inline" style="margin-bottom:8px">
            <input id="gfx-title" placeholder="" style="flex:1" data-i18n-attr="placeholder:graphics.titlePlaceholder">
          </div>
          <div class="row-inline" style="margin-bottom:8px">
            <select id="gfx-kind" style="flex:1">
              <option value="shape_2d">2D Shape</option>
              <option value="shape_3d" selected>3D Shape</option>
              <option value="chart">Chart</option>
              <option value="diagram">Diagram</option>
            </select>
          </div>
          <div class="row-inline" style="margin-bottom:8px">
            <textarea id="gfx-config" placeholder="" style="flex:1;min-height:120px;font-family:monospace;font-size:12px" data-i18n-attr="placeholder:graphics.configPlaceholder"></textarea>
          </div>
          <button class="primary" id="gfx-create" type="button" data-i18n="graphics.createBtn"></button>
          <span class="muted" id="gfx-msg" style="margin-left:8px"></span>
        </div>
        <div class="card">
          <h2 data-i18n="graphics.list"></h2>
          <div id="gfx-list" class="list"></div>
        </div>
        <div class="card" id="gfx-preview" style="display:none">
          <h2 data-i18n="graphics.preview"></h2>
          <div id="gfx-svg"></div>
        </div>
      </div>
    </div>
  </aside>
</div>

<div class="diagnostics-tray" id="diagnostics-tray">
  <div class="tray-header" id="tray-header">
    <span data-i18n="diag.title"></span>
    <span class="spacer"></span>
    <button id="tray-toggle" type="button" data-i18n="diag.clear"></button>
  </div>
  <div class="tray-content" id="tray-content">
    <div class="muted" data-i18n="diag.hint"></div>
    <pre id="diag" class="feed" style="margin-top:8px">—</pre>
    <button id="diag-clear" type="button" data-i18n="diag.clear"></button>
  </div>
</div>

<div id="toast"></div>

<script>

const DEFAULT_LANG = "en";
let LANG = DEFAULT_LANG;

function t(key) {
  const table = I18N[LANG] || I18N[DEFAULT_LANG];
  if (Object.prototype.hasOwnProperty.call(table, key)) return table[key];
  const fallback = I18N[DEFAULT_LANG];
  if (Object.prototype.hasOwnProperty.call(fallback, key)) return fallback[key];
  return key;
}

let DATA_ON_SCREEN = false;

function applyI18n(root) {
  const scope = root || document;
  document.title = t("app.title");
  scope.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    if (key) el.textContent = t(key);
  });
  scope.querySelectorAll("[data-i18n-attr]").forEach((el) => {
    const spec = el.getAttribute("data-i18n-attr") || "";
    spec.split("|").forEach((pair) => {
      const idx = pair.indexOf(":");
      if (idx < 0) return;
      const attr = pair.slice(0, idx).trim();
      const key = pair.slice(idx + 1).trim();
      if (attr && key) el.setAttribute(attr, t(key));
    });
  });
}

const LANG_STORE_KEY = "agent_os_lang";
const TOKEN_STORE_KEY = "agent_os_token";
const OBS_SOURCE = "C:/Users/Mehdi/AppData/Local/hermes/profiles/"
  + "my-personal-assistant/state.db";
let OBS_CURSOR = 0;
function readStore(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function writeStore(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* storage disabled */ }
}
function loadLang() {
  const saved = readStore(LANG_STORE_KEY);
  if (saved && Object.prototype.hasOwnProperty.call(I18N, saved)) return saved;
  return DEFAULT_LANG;
}
function persistLang(lang) { writeStore(LANG_STORE_KEY, lang); }

function syncLangSelect() {
  const el = $("lang-select");
  if (el && el.value !== LANG) el.value = LANG;
}

function setLang(lang) {
  LANG = Object.prototype.hasOwnProperty.call(I18N, lang) ? lang : DEFAULT_LANG;
  document.documentElement.lang = LANG === "fa" ? "fa" : "en";
  document.documentElement.dir = LANG === "fa" ? "rtl" : "ltr";
  persistLang(LANG);
  syncLangSelect();
  if (typeof applyI18n === "function") applyI18n();
  if (typeof _labelProjectForm === "function") _labelProjectForm();
  if (DATA_ON_SCREEN && typeof refresh === "function") {
    try { refresh(); } catch (e) { /* refresh reports its own failures */ }
  }
  return LANG;
}

function localeFor() {
  return LANG === "fa" ? "fa-IR" : "en-US";
}

const UI_LOG_CAP = 200;
const UI_LOG = [];
let UI_LOG_DIRTY = false;

function _errText(e) {
  if (!e) return "unknown error";
  if (typeof e === "string") return e;
  return e.message || e.name || String(e);
}

function uiLog(level, message, fields) {
  const entry = {
    at: new Date().toISOString().slice(11, 23),
    level: level || "error",
    message: String(message),
  };
  if (fields) for (const k of Object.keys(fields)) entry[k] = fields[k];
  UI_LOG.push(entry);
  while (UI_LOG.length > UI_LOG_CAP) UI_LOG.shift();
  UI_LOG_DIRTY = true;
  const line = `${entry.at} ${entry.level.toUpperCase()} ${entry.message}`;
  if (entry.level === "error") console.error(line, fields || "");
  else console.warn(line, fields || "");
  const el = $("diag");
  if (el) el.textContent = UI_LOG.length
    ? UI_LOG.map((r) => `${r.at} ${r.level.toUpperCase().padEnd(5)} ${r.message}`
        + (r.detail ? `  (${r.detail})` : "")
        + (r.path ? `  [${r.status ?? "?"} ${r.path}]` : "")).join("\n")
    : "—";
}

function uiLogClear() {
  UI_LOG.length = 0;
  UI_LOG_DIRTY = false;
  const el = $("diag");
  if (el) el.textContent = "—";
}

const $ = (id) => document.getElementById(id);
let TOKEN = readStore(TOKEN_STORE_KEY) || "";
let selectedMission = null;
let selectedJob = null;

$("token").value = TOKEN;

async function api(method, path, body) {
  const headers = {};
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const resp = await fetch(path, {
    method, headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const data = await resp.json().catch(() => {
    uiLog("warn", "response body was not JSON",
      { status: resp.status, path: `${method} ${path}` });
    return {};
  });
  if (!resp.ok) {
    const err = data.error || {};
    const e = new Error(err.message || ("HTTP " + resp.status));
    e.reason = err.reason || "";
    throw e;
  }
  return data;
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), 3000);
}

function badge(state) {
  return `<span class="badge b-${state}">${state}</span>`;
}

function escapeHtml(s) {
  return String(s === undefined || s === null ? "" : s)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}

async function connect() {
  TOKEN = $("token").value.trim();
  writeStore(TOKEN_STORE_KEY, TOKEN);
  try {
    await api("GET", "/api/status");
    $("conn").textContent = t("conn.connected"); $("conn").style.color = "var(--ok)";
  } catch (e) {
    $("conn").textContent = t("err.prefix") + e.message; $("conn").style.color = "var(--bad)";
    throw e;
  }
}

async function loadStatus() {
  const s = await api("GET", "/api/status");
  $("status").innerHTML = `
    <div><b>${t("sys.version")}</b> ${escapeHtml(s.version)}</div>
    <div><b>${t("sys.executors")}</b> ${(s.executors||[]).join(", ") || t("sys.none")}</div>
    <div><b>${t("sys.db")}</b> <span class="muted">${escapeHtml(s.db_path)}</span></div>`;
}

async function loadMissions() {
  const d = await api("GET", "/api/missions");
  const el = $("missions");
  el.innerHTML = "";
  (d.missions || []).forEach((m) => {
    const div = document.createElement("button");
    div.type = "button";
    div.className = "item";
    div.innerHTML = `<span class="t">${escapeHtml(m.title)}</span><span class="m">${badge(m.state)}</span>`;
    div.onclick = () => { selectedMission = m; loadMissionDetail(m.id); };
    el.appendChild(div);
  });
}

async function loadMissionDetail(id) {
  const m = await api("GET", "/api/missions/" + id);
  $("mission-detail").innerHTML = `
    <div class="row-inline"><b>${escapeHtml(m.title)}</b> ${badge(m.state)}
      <span class="muted">${escapeHtml(m.id)}</span></div>
    <div class="row-inline" style="margin-top:6px">
      <button id="btn-activate" class="primary">${t("mission.activate")}</button>
      <button id="btn-new-job">${t("mission.newJob")}</button>
    </div>`;
  $("btn-activate") && ($("btn-activate").onclick = () => activateMission(id));
  $("btn-new-job") && ($("btn-new-job").onclick = () => newJobPrompt(id));
  await loadJobs(id);
}

async function loadJobs(missionId) {
  const d = await api("GET", "/api/jobs");
  const jobs = (d.jobs || []).filter((j) => j.mission_id === missionId);
  const el = $("jobs");
  el.innerHTML = "";
  jobs.forEach((j) => {
    const div = document.createElement("button");
    div.type = "button";
    div.className = "item";
    div.innerHTML = `<span class="t">${escapeHtml(j.title)}</span>
      <span class="m">${badge(j.state)} · ${escapeHtml(j.executor)} · ${t("job.attempt")} ${j.attempt_no}</span>`;
    div.onclick = () => showJob(j);
    el.appendChild(div);
  });
}

function showJob(j) {
  selectedJob = j;
  $("job-card").style.display = "block";
  renderJobDetail(j.id).catch((e) => toast(t("err.prefix") + e.message));
}

async function renderJobDetail(jobId) {
  const j = await api("GET", "/api/jobs/" + jobId);
  const actions = [];
  if (j.state === "proposed") {
    actions.push(`<button class="primary" onclick="requestApproval('${j.id}')">${t("job.requestApproval")}</button>`);
  }
  if (j.state === "approved") {
    actions.push(`<button class="primary" onclick="dispatchJob('${j.id}')">${t("job.dispatch")}</button>`);
  }
  if (j.state === "interrupted_unknown") {
    actions.push(`<button class="bad" onclick="reconcileJob('${j.id}')">${t("job.reconcile")}</button>`);
  }
  if (j.state === "awaiting_approval") {
    actions.push(`<span class="muted">${t("job.awaitingHuman")}</span>`);
  }

  let evidenceHtml = "";
  if (["completed_verified", "completed_unverified", "failed", "interrupted_unknown"].includes(j.state)) {
    try {
      const ev = await api("GET", `/api/jobs/${j.id}/evidence`);

async function loadApprovals() {
  const d = await api("GET", "/api/approvals");
  const el = $("approvals");
  el.innerHTML = "";
  const pending = (d.approvals || []).filter((a) => a.decision === "requested");
  if (pending.length === 0) { el.innerHTML = `<div class="muted">${t("approvals.none")}</div>`; return; }
  pending.forEach((a) => {
    const div = document.createElement("div");
    div.className = "approval-card";
    const cmd = Array.isArray(a.scope.command) ? a.scope.command : null;
    const cmdHtml = cmd
      ? `<div class="m tech" style="margin-top:4px">${escapeHtml(cmd.join(" "))}</div>`
      : "";
    // test_every_user_supplied_interpolation_is_escaped scans for ${expr}
    // inside innerHTML and cannot see that a variable was escaped earlier, so
    // a raw ${cmdHtml} there reads as an unescaped user value. Escaping at
    // construction is also simply where it belongs. The name matches the
    // existing evidenceHtml convention, which is the allowlist entry for
    // "already-escaped markup held in a variable".
    const cmdSafe = escapeHtml(cmdHtml);
    div.innerHTML = `<div class="t">${t("approvals.forJob")} <span class="muted">${escapeHtml(a.job_id)}</span></div>
      <div class="m">scope: ${escapeHtml(a.scope.executor)} · ${escapeHtml((a.scope.actions||[]).join(", "))}</div>
      ${cmdSafe}
      <div class="row-inline" style="margin-top:6px">
        <button class="ok" onclick="decide('${a.id}','granted')">${t("approvals.grant")}</button>
        <button class="bad" onclick="decide('${a.id}','denied')">${t("approvals.reject")}</button>
      </div>`;
    el.appendChild(div);
  });
}

function reasonText(reason, fallback) {
  switch (reason) {
    case "not_absolute": return t("err.not_absolute");
    case "traversal": return t("err.traversal");
    case "outside_scope": return t("err.outside_scope");
    case "missing": return t("err.missing");
    case "not_a_directory": return t("err.not_a_directory");
    case "not_readable": return t("err.not_readable");
    case "symlink_escapes_scope": return t("err.symlink_escapes_scope");
    case "windows_unsupported": return t("err.windows_unsupported");
    case "scope_unset": return t("err.scope_unset");
    case "duplicate": return t("err.duplicate");
    default: return fallback;
  }
}

function renderDiscovery(d) {
  const el = $("tool-discovery");
  el.innerHTML = "";
  const tools = (d && d.tools) || [];
  const skipped = (d && d.skipped) || [];

  if (tools.length === 0) {
    el.innerHTML = `<div class="muted">${escapeHtml(t("ui.toolsNone"))}</div>`;
  } else {
    tools.forEach((tool) => {
      const div = document.createElement("div");
      div.className = "item";
      const pathSafe = escapeHtml(tool.path || "");
      const verSafe = escapeHtml(tool.version || t("ui.toolsVersionUnknown"));
      const noteSafe = escapeHtml(tool.note || "");
      div.innerHTML = `
        <div class="t">${escapeHtml(tool.name)}
          <span class="pill">${escapeHtml(tool.confidence)}</span>
          <span class="pill">${escapeHtml(tool.environment)}</span>
        </div>
        <div class="tech">${verSafe}${_toolConfidenceBadgeHtml(tool)}${_toolProvenanceNoteHtml(tool)}</div>
        <div class="tech muted">${pathSafe}</div>
        ${noteSafe ? `<div class="m">${noteSafe}</div>` : ""}
        <div class="row-inline">
          <button type="button" class="pill" data-tool-name="${escapeHtml(tool.name)}">${escapeHtml(t("ui.toolsRegister"))}</button>
          <span class="muted" data-tool-msg hidden></span>
        </div>`;
      const btn = div.querySelector("button.pill");
      const msg = div.querySelector("[data-tool-msg]");
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try {
          await api("POST", "/api/tools/registry", {
            name: tool.name,
            environment: tool.environment,
            path: tool.path,
            version: tool.version,
            confidence: tool.confidence,
          });
          msg.hidden = true;
          await loadTools();
        } catch (e) {
          msg.textContent = reasonText(e.reason, t("ui.toolsRegisterFail"));
          msg.hidden = false;
          btn.disabled = false;
        }
      });
      el.appendChild(div);
    });
  }

  if (skipped.length > 0) {
    const h = document.createElement("div");
    h.className = "m";
    h.textContent = t("ui.toolsSkipped");
    el.appendChild(h);
    const hint = document.createElement("div");
    hint.className = "muted";
    hint.textContent = t("ui.toolsSkippedHint");
    el.appendChild(hint);
    const wrap = document.createElement("div");
    wrap.className = "tech muted";
    wrap.textContent = skipped.map((x) => x.name).join(" · ");
    el.appendChild(wrap);
  }
}

const OBS_UNKNOWN = "unknown";

function obsTextSafe(v) {
  if (v === null || v === undefined) return OBS_UNKNOWN;
  const s = String(v).trim();
  return s ? s : OBS_UNKNOWN;
}

function obsTimeSafe(ts, locale) {
  if (!ts || ts <= 0) return OBS_UNKNOWN;
  try {
    return new Date(ts * 1000).toLocaleTimeString(locale);
  } catch (e) {
    return OBS_UNKNOWN;
  }
}

function obsRenderState(state, locale) {
  const el = $("obs-state");
  if (!el) return;
  if (state === "unavailable") {
    el.textContent = t("ui.obsUnavailable");
    el.style.color = "var(--bad)";
  } else if (state === "none") {
    el.textContent = t("ui.obsNone");
    el.style.color = "var(--muted)";
  } else if (state === "ok") {
    el.textContent = t("ui.obsOk");
    el.style.color = "var(--muted)";
  } else {
    el.textContent = "";
    el.style.color = "var(--muted)";
  }
}

async function obsIngest() {
  const btn = $("obs-ingest");
  const msg = $("obs-msg");
  btn.disabled = true;
  msg.textContent = "";
  if (!TOKEN) {
    msg.textContent = t("ui.obsNeedToken");
    btn.disabled = false;
    return;
  }
  try {
    const d = await api("POST", "/api/events/ingest",
      { source: OBS_SOURCE, cursor: OBS_CURSOR, limit: 200 });
    OBS_CURSOR = d.cursor || OBS_CURSOR;
    obsRenderState(d.status, localeFor());
    const added = d.added || 0;
    if (d.status === "unavailable") {
      msg.textContent = t("ui.obsUnavailable");
    } else if (added === 0) {
      msg.textContent = t("ui.obsNothingNew");
    } else {
      msg.textContent = t("ui.obsAdded").replace("{n}", String(added));
    }
    await obsRender();
  } catch (e) {
    msg.textContent = reasonText(e.reason, t("ui.obsFailed"));
    obsRenderState("unavailable", localeFor());
  } finally {
    btn.disabled = false;
  }
}

async function obsRender() {
  const d = await api("GET", "/api/events/external");
  const list = $("obs-list");
  list.innerHTML = "";
  const events = (d.events || []).slice().reverse();
  if (events.length === 0) {
    list.textContent = t("ui.obsEmpty");
    return;
  }
  const locale = localeFor();
  events.forEach((e) => {
    const p = e.payload || {};
    const div = document.createElement("div");
    div.className = "row";
    const timeSafe = escapeHtml(obsTimeSafe(p.source_timestamp, locale));
    const toolSafe = escapeHtml(obsTextSafe(p.tool_name));
    const srcSafe = escapeHtml(obsTextSafe(p.source));
    const sessSafe = escapeHtml(obsTextSafe(p.session_id));
    const notes = Array.isArray(p.notes) ? p.notes : [];
    const noteSafe = escapeHtml(notes.join(" · ") || t("ui.obsNoNotes"));
    const toolNameSafe = obsTextSafe(p.tool_name);
    const badgeLabelSafe = escapeHtml(t("ui.obsUnattributed"));
    const badgeMarkupSafe = toolNameSafe === OBS_UNKNOWN
      ? `<span class="badge b-failed">${badgeLabelSafe}</span> `
      : "";
    const rowMarkupSafe =
      `<span class="ts">${timeSafe}</span> ${badgeMarkupSafe}` +
      `<span class="kind" dir="ltr">${toolSafe}</span> ` +
      `<span class="muted" dir="ltr">${srcSafe}</span> ` +
      `<span class="muted" dir="ltr">${sessSafe}</span> ` +
      `<span class="muted">${noteSafe}</span>`;
    div.innerHTML = rowMarkupSafe;
    list.appendChild(div);
  });
}

// ----------------------------------------------------
// 3D GALAXY SCENE
// ----------------------------------------------------
function initGalaxy() {
  if (!window.THREE) return;
  const canvas = document.getElementById("bg-canvas");
  if (!canvas) return;
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 20;

  // Add sun sphere
  const sunGeo = new THREE.SphereGeometry(1, 32, 32);
  const sunMat = new THREE.MeshBasicMaterial({color: 0xffb84d, transparent: true, opacity: 0.9});
  const sun = new THREE.Mesh(sunGeo, sunMat);
  scene.add(sun);

  // Add rings
  const ringGroup = new THREE.Group();
  [[1.2,0.3,0],[1.1,-0.9,0.5],[1.3,1.1,-0.4],[1.42,0.1,1.2]].forEach((arr, i) => {
    const geo = new THREE.TorusGeometry(1, 0.006, 8, 160);
    const mat = new THREE.MeshBasicMaterial({color: (i%2) ? 0xffd98a : 0xffb06a, transparent: true, opacity: 0.25});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.scale.set(arr[0], arr[0], arr[0]);
    mesh.rotation.set(arr[1] + Math.PI/2, arr[2], 0);
    ringGroup.add(mesh);
  });
  scene.add(ringGroup);

  // simple starfield
  const starsGeo = new THREE.BufferGeometry();
  const starsArray = new Float32Array(3000);
  for(let i=0; i<3000; i++) {
    starsArray[i] = (Math.random() - 0.5) * 50;
  }
  starsGeo.setAttribute('position', new THREE.BufferAttribute(starsArray, 3));
  const starsMat = new THREE.PointsMaterial({color: 0xa79ecb, size: 0.05, transparent: true, opacity: 0.6});
  const starField = new THREE.Points(starsGeo, starsMat);
  scene.add(starField);

  // Animation layout
  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  const animate = function() {
    requestAnimationFrame(animate);
    ringGroup.children.forEach((c, i) => {
      c.rotation.z += 0.002 * (i%2 ? 1 : -1) * (1 + i*0.4);
    });
    starField.rotation.y += 0.0005;
    starField.rotation.x += 0.0002;
    renderer.render(scene, camera);
  };
  animate();
}
initGalaxy();

  } else {
    feed.querySelectorAll(".row").forEach((row) => {

      const match = level === "info" && text.includes("INFO") ||
                    level === "warn" && text.includes("WARN") ||
                    level === "error" && text.includes("ERROR") ||

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  if (e.altKey && e.key >= "1" && e.key <= "4") {
    const tabs = ["approvals", "evidence", "feed", "observed"];
    const idx = parseInt(e.key) - 1;
    if (idx < tabs.length) switchTab(tabs[idx]);
  }
  if (e.key === "a" || e.key === "A") {
    const activePanel = document.querySelector(".tab-panel.active");
    if (activePanel && activePanel.id === "panel-approvals") {
      const grantBtn = activePanel.querySelector(".ok");
      if (grantBtn) grantBtn.click();
    }
  }
  if (e.key === "r" || e.key === "R") {
    const activePanel = document.querySelector(".tab-panel.active");
    if (activePanel && activePanel.id === "panel-approvals") {
      const rejectBtn = activePanel.querySelector(".bad");
      if (rejectBtn) rejectBtn.click();
    }
  }
});

// Workflows
let wfSelectedTemplate = null;

async function loadWorkflows() {
  try {
    const res = await api("GET", "/api/workflows");
    const list = $("wf-list");
    if (!res.workflows || res.workflows.length === 0) {
      list.innerHTML = '<div class="muted">' + t("wf.noTemplates") + '</div>';
      return;
    }
    list.innerHTML = res.workflows.map(wf => {
      const nodeCount = wf.nodes ? wf.nodes.length : 0;
      return '<div class="item" data-wf-id="' + wf.id + '">' +
        '<span class="t">' + escapeHtml(wf.title) + '</span>' +
        '<span class="m">v' + wf.version + ' | ' + nodeCount + ' nodes | ' + escapeHtml(wf.default_executor) + '</span>' +
        '<button class="ok" style="margin-top:4px" onclick="wfRun(\'' + wf.id + '\')">' + t("wf.runBtn") + '</button>' +
        '</div>';
    }).join("");
  } catch (e) { /* silent */ }
}

function wfRun(templateId) {
  wfSelectedTemplate = templateId;
  $("wf-run-card").style.display = "";
  $("wf-run-msg").textContent = "";
  $("wf-run-inputs").value = "{}";
  $("wf-run-card").scrollIntoView({ behavior: "smooth" });
}

$("wf-create").addEventListener("click", async () => {
  const title = $("wf-title").value.trim();
  const desc = $("wf-desc").value.trim();
  const executor = $("wf-executor").value.trim();
  const nodesRaw = $("wf-nodes").value.trim();
  if (!title) { $("wf-msg").textContent = "Title required"; return; }
  if (!nodesRaw) { $("wf-msg").textContent = "Nodes JSON required"; return; }
  let nodes;
  try { nodes = JSON.parse(nodesRaw); }
  catch (e) { $("wf-msg").textContent = t("wf.nodesInvalid"); return; }
  try {
    await api("POST", "/api/workflows", {
      title, description: desc, default_executor: executor,
      inputs_schema: {}, nodes
    });
    $("wf-msg").textContent = t("wf.created");
    $("wf-title").value = ""; $("wf-desc").value = "";
    $("wf-executor").value = ""; $("wf-nodes").value = "";
    loadWorkflows();
  } catch (e) { $("wf-msg").textContent = t("wf.createFailed") + ": " + e.message; }
});

$("wf-run").addEventListener("click", async () => {
  if (!wfSelectedTemplate) return;
  const inputsRaw = $("wf-run-inputs").value.trim();
  let inputs;
  try { inputs = JSON.parse(inputsRaw || "{}"); }
  catch (e) { $("wf-run-msg").textContent = t("wf.inputsInvalid"); return; }
  try {
    const res = await api("POST", "/api/workflows/" + wfSelectedTemplate + "/execute", { inputs });
    $("wf-run-msg").textContent = t("wf.executed") + " (execution: " + res.id + ")";
    $("wf-exec-card").style.display = "";
    $("wf-exec-detail").textContent = JSON.stringify(res, null, 2);
    loadWorkflows();
  } catch (e) { $("wf-run-msg").textContent = t("wf.executeFailed") + ": " + e.message; }
});

// Simple Graphics
let gfxSelected = null;

async function loadGraphics() {
  try {
    const res = await api("GET", "/api/graphics");
    const list = $("gfx-list");
    if (!res.graphics || res.graphics.length === 0) {
      list.innerHTML = '<div class="muted">No graphics yet</div>';
      return;
    }
    list.innerHTML = res.graphics.map(g => {
      const hint = g.config && g.config.shape ? escapeHtml(g.config.shape) : "";
      const delBtn = g.state === "deleted"
        ? ""
        : '<button class="bad" style="margin-top:4px" onclick="gfxDelete(\'' + g.id + '\')">Remove</button>';
      return '<div class="item" data-gfx-id="' + g.id + '">' +
        '<span class="t">' + escapeHtml(g.title) + '</span>' +
        '<span class="m">' + g.kind + (hint ? " | " + hint : "") +
        ' <span class="badge">' + (g.state || "active") + '</span></span>' +
        '<button class="ok" style="margin-top:4px" onclick="gfxRender(\'' + g.id + '\')">Render</button>' + delBtn +
        '</div>';
    }).join("");
  } catch (e) { /* silent */ }
}

async function gfxCreate() {
  const title = $("gfx-title").value.trim();
  const kind = $("gfx-kind").value;
  if (!title) { $("gfx-msg").textContent = "Title required"; return; }
  let config;
  try { config = JSON.parse($("gfx-config").value.trim() || "{}"); }
  catch (e) { $("gfx-msg").textContent = "Config invalid"; return; }
  try {
    await api("POST", "/api/graphics", { title, kind, config });
    $("gfx-msg").textContent = "Created";
    $("gfx-title").value = ""; $("gfx-config").value = "";
    loadGraphics();
  } catch (e) { $("gfx-msg").textContent = "Create failed: " + e.message; }
}

async function gfxRender(gid) {
  gfxSelected = gid;
  try {
    const res = await api("POST", "/api/graphics/" + gid + "/render");
    $("gfx-svg").innerHTML = res.svg;
    $("gfx-preview").style.display = "";
    $("gfx-preview").scrollIntoView({ behavior: "smooth" });
  } catch (e) { $("gfx-msg").textContent = "Render failed: " + e.message; }
}

async function gfxDelete(gid) {
  try {
    await api("DELETE", "/api/graphics/" + gid);
    loadGraphics();
  } catch (e) { $("gfx-msg").textContent = "Delete failed: " + e.message; }
}

$("gfx-create").addEventListener("click", gfxCreate);

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

(async () => {
  if (TOKEN) {
    try {
      await refresh();
      loadWorkflows();
      loadGraphics();
    } catch (e) {
      uiLog("error", "initial load failed", { detail: _errText(e) });
    }
  }
  else { $("conn").textContent = t("conn.needToken"); }
  setInterval(() => { if (TOKEN) { refresh(); loadWorkflows(); loadGraphics(); } }, 4000);
})();
</script>
</body>
