<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent OS — Mission Control</title>
<style>
  /* ==========================================================
     Neural Command design system — ported from
     docs/UI-Design/agent-os-neural-command-robot.html
     (fonts degrade to local stacks: the console must stay offline)
     ========================================================== */
  :root {
    --bg: #02070f; --tx: #e4f6ff; --mu: #8eaec2;
    --line: rgba(110, 215, 255, .15);
    --sun: #38e8ff; --sun2: #b8f6ff;
    --run: #4fd6ff; --await: #ff9a52; --ok: #5ff0a8;
    --off: #6b7fa6; --bad: #ff5c7a; --mag: #c77dff;
    --code-bg: rgba(0, 0, 0, .55);
    --disp: "Chakra Petch", "Segoe UI", Tahoma, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--tx); font-size: 15px; line-height: 1.5;
    font-family: Hind, system-ui, "Segoe UI", Tahoma, sans-serif;
  }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
  .f-fa { font-family: Vazirmatn, Hind, Tahoma, sans-serif; }
  .f-en { font-family: Hind, system-ui, sans-serif; }
  .disp { font-family: var(--disp); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .f-fa .disp, .disp.f-fa { font-family: Vazirmatn, Tahoma, sans-serif; font-weight: 700; letter-spacing: 0; text-transform: none; }
  .mono { font-family: var(--mono); }

  .deck {
    min-height: 100vh;
    background:
      radial-gradient(60% 40% at 80% 6%, rgba(56, 232, 255, .08), transparent 70%),
      radial-gradient(50% 50% at 8% 92%, rgba(199, 125, 255, .10), transparent 70%),
      var(--bg);
  }

  .glass {
    background: linear-gradient(180deg, rgba(10, 30, 48, .72), rgba(4, 14, 26, .80));
    border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 20px 60px -30px #000c, inset 0 1px rgba(160, 240, 255, .06);
    backdrop-filter: blur(14px);
  }
  .glass-flare { border-color: rgba(255, 154, 82, .35); box-shadow: 0 0 50px -24px rgba(255, 154, 82, .55), inset 0 1px rgba(255, 255, 255, .04); }
  .hud-frame { position: relative; overflow: hidden; }
  .hud-frame:before, .hud-frame:after {
    content: ""; position: absolute; width: 22px; height: 22px;
    border: 2px solid rgba(56, 232, 255, .55); pointer-events: none; z-index: 5;
  }
  .hud-frame:before { top: 10px; inset-inline-start: 10px; border-inline-end: 0; border-bottom: 0; border-radius: 6px 0 0; }
  .hud-frame:after { bottom: 10px; inset-inline-end: 10px; border-inline-start: 0; border-top: 0; border-radius: 0 0 6px; }

  .scroll::-webkit-scrollbar { height: 6px; width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(110, 215, 255, .2); border-radius: 9px; }

  /* ---------- top bar ---------- */
  .top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    padding: 10px 18px; border-bottom: 1px solid var(--line);
    background: rgba(2, 8, 16, .75); backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .orb { position: relative; display: grid; place-items: center; width: 40px; height: 40px; }
  .orb i {
    position: absolute; inset: 0; border-radius: 999px;
    background: radial-gradient(circle, #e8feff 0 14%, #38e8ff 30%, rgba(56, 232, 255, .18) 56%, transparent 72%);
  }
  .orb b {
    position: absolute; inset: -2px; border-radius: 999px;
    border: 1px solid rgba(56, 232, 255, .45); transform: scaleY(.32);
  }
  .brand .name { font-size: 22px; line-height: 1; color: var(--sun2); text-transform: uppercase; letter-spacing: .08em; }
  .brand .sep { width: 1px; height: 24px; background: var(--line); }
  .brand .sec { color: var(--mu); font-size: 15px; }
  .top .spacer { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 8px; color: var(--sun); font-size: 14px; }
  .dotlive { position: relative; display: inline-block; }
  .dotlive:after {
    content: ""; position: absolute; inset: -4px; border-radius: 999px;
    border: 1px solid currentColor; animation: ping 2s ease-out infinite;
  }
  @keyframes ping { 0% { opacity: .8; transform: scale(.6); } to { opacity: 0; transform: scale(1.8); } }
  .top .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    background: rgba(2, 10, 20, .6); border: 1px solid var(--line);
    font-size: 12px; font-family: var(--mono);
  }
  .langsel { color: var(--mu); font-size: 13px; }

  /* ---------- buttons & fields ---------- */
  button { cursor: pointer; font: inherit; }
  input, select, textarea {
    background: rgba(2, 10, 20, .7); color: var(--tx);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 12px; font-size: 14px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: rgba(56, 232, 255, .6); }
  .field { width: 100%; border-radius: 12px; }
  button.navi, button.pill-btn {
    background: rgba(2, 10, 20, .6); color: var(--tx);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 14px;
    transition: border-color .2s, color .2s, background .2s;
  }
  button.navi:hover, button.pill-btn:hover { border-color: rgba(56, 232, 255, .5); color: var(--sun2); }
  button.btn-core {
    background: linear-gradient(180deg, #9af7ff, #1fc6e6); color: #00222c;
    border: 1px solid rgba(56, 232, 255, .6); border-radius: 999px;
    padding: 8px 16px; font-weight: 600; box-shadow: 0 0 24px -6px rgba(56, 232, 255, .8);
  }
  button.btn-core:hover { filter: brightness(1.1); }
  button.ok { background: rgba(95, 240, 168, .12); color: #c9f7dd; border: 1px solid rgba(95, 240, 168, .5); border-radius: 999px; padding: 7px 15px; font-weight: 600; }
  button.ok:hover { background: rgba(95, 240, 168, .2); }
  button.bad { background: rgba(255, 92, 122, .1); color: #ffc0ca; border: 1px solid rgba(255, 92, 122, .5); border-radius: 999px; padding: 7px 15px; font-weight: 600; }
  button.bad:hover { background: rgba(255, 92, 122, .18); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .chip[data-on="true"] { border-color: rgba(56, 232, 255, .7); background: rgba(56, 232, 255, .12); color: #e6fdff; }
  .inline-chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px;
  }

  /* ---------- layout ---------- */
  .grid {
    display: grid; grid-template-columns: 1fr; gap: 14px; padding: 14px 16px 26px;
  }
  @media (min-width: 1024px) {
    .grid {
      grid-template-columns: 230px 1fr 360px;
      grid-template-rows: minmax(680px, 1fr) auto;
    }
    .side { grid-row: span 2; }
    .logrow { grid-column: 2 / 4; }
  }
  .side { padding: 8px; display: flex; flex-direction: column; gap: 4px; overflow-x: auto; }
  @media (min-width: 1024px) { .side { flex-direction: column; overflow: visible; } }
  .navi {
    display: flex; align-items: center; gap: 10px; text-align: start;
    border-radius: 12px; padding: 10px 12px; color: var(--mu);
    background: transparent; border: 0; position: relative; white-space: nowrap;
    transition: background .2s, color .2s;
  }
  .navi:hover { color: #fff; }
  .navi.on {
    color: #e9fdff;
    background: linear-gradient(90deg, rgba(56, 232, 255, .14), rgba(56, 232, 255, .02));
  }
  .navi.on:before {
    content: ""; position: absolute; inset-block: 8px; inset-inline-start: 0;
    width: 3px; border-radius: 999px; background: var(--sun); box-shadow: 0 0 10px #38e8ff;
  }
  .navi svg { flex: none; }
  .side .help { margin-top: auto; color: var(--mu); display: none; }
  @media (min-width: 1024px) { .side .help { display: flex; } }

  main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .view { display: none; }
  .view.active { display: block; }
  .view-pad { padding: 14px; }
  .card h2, .view-pad > h2 { font-size: 13px; margin: 0 0 10px; color: var(--mu); text-transform: uppercase; letter-spacing: .5px; }
  .card h3 { font-size: 12px; margin: 14px 0 8px; color: var(--mu); text-transform: uppercase; letter-spacing: .5px; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: rgba(2, 10, 20, .45); }
  .card + .card { margin-top: 12px; }

  /* ---------- neural scene ---------- */
  .scene-wrap { position: relative; min-height: 480px; flex: 1; direction: ltr; }
  #scene-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene-head {
    position: relative; z-index: 10; display: flex; flex-wrap: wrap; align-items: flex-end;
    gap: 6px 16px; padding: 20px 24px 0;
  }
  .scene-head h2 { font-size: 30px; line-height: 1; color: var(--sun2); margin: 0; text-shadow: 0 0 18px rgba(56, 232, 255, .45); }
  .scene-head .sub { color: var(--mu); font-size: 14px; padding-bottom: 2px; }
  .scene-controls {
    position: relative; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px;
    padding: 14px 24px 0; align-items: center;
  }
  .search {
    display: flex; align-items: center; gap: 8px; flex: 1; min-width: 220px;
    border: 1px solid var(--line); background: rgba(2, 10, 20, .6);
    border-radius: 999px; padding: 8px 16px;
  }
  .search input { flex: 1; background: transparent; border: 0; padding: 0; color: var(--tx); }
  .node-label {
    position: absolute; pointer-events: none; white-space: nowrap; line-height: 1.25;
    text-shadow: 0 1px 8px #000, 0 0 2px #000; z-index: 6;
  }
  .node-label b { display: block; font-family: var(--disp); font-size: 14px; font-weight: 600; letter-spacing: .05em; color: #f1fbff; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .node-label small { display: block; font-size: 12px; color: #a9c6d6; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .node-label .st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
  .node-label .st i { width: 6px; height: 6px; border-radius: 999px; }
  .cmd-tag {
    position: absolute; pointer-events: none; white-space: nowrap;
    font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
    text-shadow: 0 0 10px currentColor, 0 1px 4px #000; z-index: 6;
  }
  .hit { position: absolute; width: 52px; height: 52px; border-radius: 999px; background: transparent; border: 0; z-index: 8; cursor: grab; }
  .hit:active { cursor: grabbing; }
  .hit.dragging { cursor: grabbing; }
  .hit:focus-visible { outline: 2px solid var(--sun); outline-offset: 4px; }
  .scene-hint {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    z-index: 15; display: flex; align-items: center; gap: 10px;
    background: rgba(4, 14, 26, .92); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 8px 6px 16px; font-size: 12.5px; color: var(--mu);
    box-shadow: 0 12px 30px -18px #000c; max-width: 92%;
  }
  .scene-hint .pill-btn { padding: 3px 12px; font-size: 12px; }
  .fiber-tip {
    position: absolute; z-index: 18; pointer-events: none;
    min-width: 150px; max-width: 230px;
    background: rgba(4, 14, 26, .95); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 11px; font-size: 12.5px; color: var(--tx);
    box-shadow: 0 12px 30px -18px #000c;
  }
  .fiber-tip .ft-head { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
  .fiber-tip .ft-head i { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  .fiber-tip .ft-head b { font-family: var(--disp); font-size: 13px; letter-spacing: .03em; color: #f1fbff; }
  .fiber-tip .ft-row { color: var(--mu); }
  .hit.core-hit { width: 120px; height: 110px; }
  .core-tag {
    position: absolute; pointer-events: none; white-space: nowrap; z-index: 6;
    display: flex; gap: 8px; align-items: center; justify-content: center;
    font-size: 12px; color: var(--sun2); letter-spacing: .16em; text-transform: uppercase;
    text-shadow: 0 0 12px rgba(56, 232, 255, .8), 0 1px 6px #000;
    transform: translateX(-50%);
  }
  .core-tag em { font-family: var(--disp); font-style: normal; font-weight: 700; font-size: 16px; letter-spacing: .08em; color: #effdff; }

  .scene-foot {
    position: relative; z-index: 10; display: flex; flex-wrap: wrap; align-items: stretch;
    gap: 12px; padding: 0 20px 16px; margin-top: 8px;
  }
  .scene-foot .box {
    background: rgba(4, 14, 26, .8); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px;
  }
  .scene-foot .lbl { font-size: 12px; color: var(--mu); }
  .scene-foot .val { margin-top: 6px; display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; align-self: flex-end; margin-inline-start: auto; padding-bottom: 4px; color: var(--mu); font-size: 13px; }
  .legend i { display: inline-block; width: 18px; height: 3px; border-radius: 999px; margin-inline-end: 7px; vertical-align: middle; }

  /* ---------- overlay detail cards (mission/job) ---------- */
  .overlay-top { position: absolute; inset-inline: 0; top: 10px; z-index: 20; display: flex; justify-content: center; pointer-events: none; }
  .float-card {
    pointer-events: auto; position: relative; width: min(360px, 92%);
    background: linear-gradient(180deg, rgba(10, 30, 48, .92), rgba(4, 14, 26, .94));
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 20px 60px -30px #000c;
  }
  .float-card .close {
    position: absolute; top: 8px; inset-inline-end: 10px; background: transparent; border: 0;
    color: var(--mu); font-size: 16px; line-height: 1; padding: 4px;
  }
  .float-card .close:hover { color: #fff; }
  .float-card h3 { margin: 0; font-size: 17px; }
  .float-card .meta { color: var(--mu); font-size: 12px; margin-top: 2px; }
  .float-card .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .kv { margin-top: 4px; color: var(--mu); font-size: 12px; }
  .jobs-mini { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .jobs-mini button {
    text-align: start; background: rgba(2, 10, 20, .6); border: 1px solid var(--line);
    border-radius: 8px; color: var(--tx); padding: 6px 9px; font-size: 12px;
  }
  .jobs-mini button:hover { border-color: var(--sun); }

  /* ---------- approval gate ---------- */
  .col-right { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .gate { display: flex; flex-direction: column; overflow: hidden; min-height: 300px; }
  .gate-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .gate-head h2 { margin: 0; font-size: 20px; }
  .gate-head .count { margin-inline-start: auto; font-family: var(--mono); color: var(--await); }
  .gate-head .q { color: var(--mu); font-size: 13px; }
  .gate-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; overflow-y: auto; }
  .gate-empty { margin: auto; text-align: center; padding: 24px; }
  .gate-empty .ring {
    margin: 0 auto 12px; width: 48px; height: 48px; display: grid; place-items: center;
    border-radius: 999px; border: 1px solid var(--ok); color: var(--ok);
    box-shadow: 0 0 24px rgba(95, 240, 168, .35);
  }
  .gate-empty .t1 { font-size: 19px; }
  .gate-empty .t2 { color: var(--mu); margin-top: 4px; font-size: 13px; }
  .approval-card { border: 1px solid rgba(255, 154, 82, .4); border-radius: 12px; padding: 12px; background: rgba(2, 10, 20, .55); }
  .approval-card .t { font-weight: 600; }
  .scopebox { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(2, 10, 20, .55); padding: 10px; }
  .warnbox { display: flex; gap: 10px; border: 1px solid rgba(255, 154, 82, .4); background: rgba(255, 154, 82, .08); border-radius: 10px; padding: 10px; font-size: 13px; }
  .warnbox .wt { color: var(--await); font-weight: 600; }
  .warnbox .wb { color: #e2cdb8; }

  /* ---------- flight log ---------- */
  .logrow { padding: 14px 16px; }
  .log-head { display: flex; align-items: center; gap: 12px; }
  .log-head h2 { margin: 0; font-size: 20px; }
  .log-controls { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .logcards { display: flex; gap: 10px; overflow-x: auto; padding: 12px 2px 6px; }
  .logcard {
    min-width: 180px; max-width: 220px; shrink: 0; text-align: start; color: var(--tx);
    border: 1px solid var(--line); border-radius: 12px; background: rgba(2, 10, 20, .6); padding: 10px 12px;
    transition: box-shadow .2s, border-color .2s;
  }
  .logcard.sel { box-shadow: 0 0 22px -4px var(--c, #38e8ff); border-color: var(--c, #38e8ff); }
  .logcard .k { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .logcard .ic { width: 26px; height: 26px; border-radius: 999px; display: grid; place-items: center; background: rgba(56, 232, 255, .13); color: var(--c, #38e8ff); flex: none; }
  .logcard .ref { font-family: var(--mono); font-size: 12px; color: #c9e3ee; margin-top: 6px; word-break: break-all; }
  .logcard .row2 { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; font-size: 12px; color: var(--mu); }
  .logcard .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--c, #38e8ff); box-shadow: 0 0 6px var(--c, #38e8ff); }
  .scrub { display: flex; align-items: center; gap: 12px; margin-top: 10px; direction: ltr; }
  .scrub .bar { position: relative; flex: 1; height: 26px; }
  .scrub .track { position: absolute; left: 0; right: 0; top: 50%; height: 4px; transform: translateY(-50%); border-radius: 999px; background: #0b2233; }
  .scrub .fill { position: absolute; left: 0; top: 50%; height: 4px; transform: translateY(-50%); border-radius: 999px; background: linear-gradient(90deg, #c77dff, #38e8ff); box-shadow: 0 0 10px rgba(56, 232, 255, .53); }
  .scrub .cursor { position: absolute; top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%); border-radius: 999px; border: 2px solid var(--sun); background: #03121c; box-shadow: 0 0 12px #38e8ff; }
  .scrub .pos { font-family: var(--mono); font-size: 12px; color: var(--mu); width: 64px; text-align: right; }

  /* ---------- lists, feed, tech ---------- */
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { padding: 9px 11px; background: rgba(2, 10, 20, .6); border: 1px solid var(--line); border-radius: 10px; }
  .item:hover { border-color: rgba(56, 232, 255, .5); }
  button.item { text-align: start; width: 100%; font: inherit; color: inherit; display: block; cursor: pointer; border-radius: 10px; }
  .item .t { display: block; font-weight: 600; }
  .item .m { display: block; color: var(--mu); font-size: 12px; }
  .row-inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--mu); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; font-family: var(--mono); }
  .b-draft { background: rgba(107, 127, 166, .2); color: var(--off); }
  .b-active { background: rgba(79, 214, 255, .15); color: var(--run); }
  .b-proposed { background: rgba(107, 127, 166, .2); color: var(--mu); }
  .b-awaiting_approval { background: rgba(255, 154, 82, .16); color: var(--await); }
  .b-approved { background: rgba(79, 214, 255, .15); color: var(--run); }
  .b-running { background: rgba(79, 214, 255, .15); color: var(--run); }
  .b-dispatched { background: rgba(79, 214, 255, .15); color: var(--run); }
  .b-completed_verified { background: rgba(95, 240, 168, .16); color: var(--ok); }
  .b-completed_unverified { background: rgba(255, 209, 102, .16); color: #ffd166; }
  .b-failed { background: rgba(255, 92, 122, .16); color: var(--bad); }
  .b-interrupted_unknown { background: rgba(199, 125, 255, .16); color: var(--mag); }
  .b-closed { background: rgba(107, 127, 166, .2); color: var(--off); }
  .tech {
    direction: ltr; unicode-bidi: isolate; text-align: left;
    font-family: var(--mono); font-size: 12px; word-break: break-all;
  }
  .feed { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .feed .row { padding: 5px 6px; border-bottom: 1px solid var(--line); }
  .feed .seq { color: var(--mu); }
  .feed .kind { color: var(--sun); }
  .feed .ts { color: var(--mu); float: left; }
  pre.detail {
    white-space: pre-wrap; word-break: break-word; font-size: 12px;
    background: var(--code-bg); padding: 10px; border-radius: 8px;
    font-family: var(--mono); direction: ltr; text-align: left;
    max-height: 320px; overflow: auto;
  }

  /* ---------- toast & diagnostics ---------- */
  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 60;
    background: rgba(4, 14, 26, .95); border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 12px; display: none; max-width: 80vw;
  }
  #toast.okk { border-color: rgba(95, 240, 168, .5); }
  #toast.badd { border-color: rgba(255, 92, 122, .5); }
  .diag pre { margin-top: 8px; max-height: 420px; }

  .rise { animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="deck">

  <header class="top">
    <div class="brand">
      <span class="orb"><i></i><b></b></span>
      <span class="name disp f-en">Agent OS</span>
      <span class="sep"></span>
      <span class="sec" data-i18n="app.section"></span>
      <span class="live"><i class="dotlive" style="width:8px;height:8px;border-radius:999px;background:var(--sun)"></i><span id="conn" data-i18n="conn.connecting"></span></span>
    </div>
    <span class="spacer"></span>
    <div class="controls">
      <span class="pill" id="active-mission" dir="auto">—</span>
      <input id="token" type="password" data-i18n-attr="placeholder:auth.tokenPlaceholder" class="mono" style="width:200px">
      <button id="btn-connect" class="btn-core" data-i18n="auth.connect"></button>
      <label class="langsel" for="lang-select" data-i18n="ui.language"></label>
      <select id="lang-select">
        <option value="en">English</option>
        <option value="fa">فارسی</option>
      </select>
    </div>
  </header>

  <div class="grid">

    <!-- ================= sidebar ================= -->
    <nav class="side glass scroll" aria-label="Sections">
      <button class="navi on" type="button" data-view="home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M16.247 7.761a6 6 0 0 1 0 8.478"/><path d="M19.075 4.933a10 10 0 0 1 0 14.134"/><path d="M4.925 19.067a10 10 0 0 1 0-14.134"/><path d="M7.753 16.239a6 6 0 0 1 0-8.478"/></svg>
        <span data-i18n="graph.title"></span>
      </button>
      <button class="navi" type="button" data-view="missions">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span data-i18n="mission.list"></span>
      </button>
      <button class="navi" type="button" data-view="projects">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
        <span data-i18n="ui.projects"></span>
      </button>
      <button class="navi" type="button" data-view="tools">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></svg>
        <span data-i18n="ui.tools"></span>
      </button>
      <button class="navi" type="button" data-view="workflows">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg>
        <span data-i18n="ui.workflows"></span>
      </button>
      <button class="navi" type="button" data-view="graphics">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
        <span data-i18n="graphics.title"></span>
      </button>
      <button class="navi" type="button" data-view="observed">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        <span data-i18n="ui.observedTimeline"></span>
      </button>
      <button class="navi" type="button" data-view="diag">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>
        <span data-i18n="diag.title"></span>
      </button>
    </nav>

    <!-- ================= main ================= -->
    <main>

      <!-- Neural Command (home) -->
      <section class="glass hud-frame view active" id="view-home">
        <div class="scene-head">
          <h2 class="disp" data-i18n="graph.title"></h2>
          <span class="sub" data-i18n="graph.sub"></span>
          <span class="pill mono" id="db-pill" dir="ltr">—</span>
        </div>
        <div class="scene-controls">
          <label class="search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
            <input id="scene-search" data-i18n-attr="placeholder:graph.search" dir="auto">
          </label>
          <label class="inline-chip">
            <span data-i18n="mission.new"></span>
            <input id="new-mission" data-i18n-attr="placeholder:mission.titlePlaceholder" style="width:170px;background:transparent;border:0;padding:0" dir="auto">
          </label>
          <button id="btn-mission" class="btn-core" data-i18n="mission.create"></button>
          <button id="scene-recenter" class="pill-btn" type="button" data-i18n="graph.recenter"></button>
        </div>

        <div class="scene-wrap" id="scene-wrap">
          <canvas id="scene-canvas"></canvas>
          <div id="scene-overlay"></div>

          <div class="overlay-top" id="mission-overlay" hidden>
            <div class="float-card rise" id="mission-card">
              <button class="close" id="mission-close" aria-label="Close">✕</button>
              <h2 data-i18n="mission.detail"></h2>
              <div id="mission-detail" class="muted"><span data-i18n="mission.selectOne"></span></div>
              <div id="jobs" class="jobs-mini"></div>
            </div>
          </div>

          <div class="overlay-top" id="job-overlay" hidden>
            <div class="float-card rise" id="job-card" style="width:min(460px,94%)">
              <button class="close" id="job-close" aria-label="Close">✕</button>
              <h2 data-i18n="job.detail"></h2>
              <div id="job-detail" class="muted">—</div>
            </div>
          </div>

          <div class="scene-hint" id="scene-hint" hidden>
            <span data-i18n="graph.dragHint"></span>
            <button type="button" id="hint-dismiss" class="pill-btn" data-i18n="graph.hintDismiss"></button>
          </div>

          <div class="fiber-tip" id="fiber-tip" hidden></div>
        </div>

        <div class="scene-foot">
          <div class="box">
            <div class="lbl" data-i18n="graph.statusTitle"></div>
            <div class="val" id="scene-counts"></div>
          </div>
          <div class="box">
            <div class="lbl" data-i18n="graph.lastRun"></div>
            <div class="val"><i class="dotlive" style="width:8px;height:8px;border-radius:999px;background:var(--sun)"></i><span id="last-event" class="mono">—</span></div>
          </div>
          <div class="box">
            <div class="lbl" data-i18n="sys.status"></div>
            <div class="val mono" id="sys-info">—</div>
          </div>
          <div class="legend" id="scene-legend"></div>
        </div>
      </section>

      <!-- Missions list (secondary view over the same data) -->
      <section class="glass view view-pad" id="view-missions">
        <h2 data-i18n="mission.list"></h2>
        <div id="missions-all" class="list"></div>
      </section>

      <!-- Projects -->
      <section class="glass view view-pad" id="view-projects">
        <h2 data-i18n="ui.projects"></h2>
        <form id="proj-form" class="card">
          <div class="row-inline">
            <input id="proj-name" aria-label="">
            <input id="proj-root" aria-label="" style="flex:1;min-width:220px">
            <select id="proj-env" aria-label="">
              <option value="wsl">wsl</option>
              <option value="windows">windows</option>
            </select>
            <button class="ok" id="proj-add" type="submit"></button>
          </div>
          <p id="proj-msg" class="muted" style="margin-bottom:0"></p>
        </form>
        <div class="card"><div id="proj-list" class="list"></div></div>
      </section>

      <!-- Tools -->
      <section class="glass view view-pad" id="view-tools">
        <h2 data-i18n="ui.tools"></h2>
        <div class="card">
          <div class="muted" data-i18n="ui.toolsSafety"></div>
          <div class="row-inline" style="margin-top:10px">
            <button class="ok" id="tool-discover" type="button" data-i18n="ui.toolsDiscover"></button>
            <span class="muted" id="tool-msg"></span>
          </div>
          <div id="tool-discovery" class="list" style="margin-top:10px"></div>
        </div>
        <div class="card">
          <h2 data-i18n="ui.toolsRegistry"></h2>
          <div id="tool-list" class="list"></div>
        </div>
      </section>

      <!-- Workflows -->
      <section class="glass view view-pad" id="view-workflows">
        <h2 data-i18n="ui.workflows"></h2>
        <div class="card">
          <h2 data-i18n="wf.create"></h2>
          <div class="row-inline" style="margin-bottom:8px">
            <input id="wf-title" data-i18n-attr="placeholder:wf.titlePlaceholder" style="flex:1">
          </div>
          <div class="row-inline" style="margin-bottom:8px">
            <input id="wf-desc" data-i18n-attr="placeholder:wf.descPlaceholder" style="flex:1">
          </div>
          <div class="row-inline" style="margin-bottom:8px">
            <input id="wf-executor" data-i18n-attr="placeholder:wf.executorPlaceholder" style="flex:1">
          </div>
          <div class="row-inline" style="margin-bottom:8px">
            <textarea id="wf-nodes" data-i18n-attr="placeholder:wf.nodesPlaceholder" style="flex:1;min-height:110px;font-family:var(--mono);font-size:12px"></textarea>
          </div>
          <button class="btn-core" id="wf-create" type="button" data-i18n="wf.createBtn"></button>
          <span class="muted" id="wf-msg" style="margin-inline-start:8px"></span>
        </div>
        <div class="card">
          <h2 data-i18n="wf.list"></h2>
          <div id="wf-list" class="list"></div>
        </div>
        <div class="card" id="wf-run-card" hidden>
          <h2 data-i18n="wf.run"></h2>
          <div id="wf-run-info" class="muted" style="margin-bottom:8px"></div>
          <div class="row-inline" style="margin-bottom:8px">
            <textarea id="wf-run-inputs" data-i18n-attr="placeholder:wf.inputsPlaceholder" style="flex:1;min-height:80px;font-family:var(--mono);font-size:12px"></textarea>
          </div>
          <button class="ok" id="wf-run" type="button" data-i18n="wf.runBtn"></button>
          <span class="muted" id="wf-run-msg" style="margin-inline-start:8px"></span>
        </div>
        <div class="card" id="wf-exec-card" hidden>
          <h2 data-i18n="wf.execution"></h2>
          <div id="wf-exec-detail" class="muted"></div>
        </div>
      </section>

      <!-- Graphics -->
      <section class="glass view view-pad" id="view-graphics">
        <h2 data-i18n="graphics.title"></h2>
        <div class="card">
          <h2 data-i18n="graphics.create"></h2>
          <div class="row-inline" style="margin-bottom:8px">
            <input id="gfx-title" data-i18n-attr="placeholder:graphics.titlePlaceholder" style="flex:1">
          </div>
          <div class="row-inline" style="margin-bottom:8px">
            <select id="gfx-kind" style="flex:1">
              <option value="shape_2d">2D Shape</option>
              <option value="shape_3d" selected>3D Shape</option>
              <option value="chart">Chart</option>
              <option value="diagram">Diagram</option>
            </select>
          </div>
          <div class="row-inline" style="margin-bottom:8px">
            <textarea id="gfx-config" data-i18n-attr="placeholder:graphics.configPlaceholder" style="flex:1;min-height:110px;font-family:var(--mono);font-size:12px"></textarea>
          </div>
          <button class="btn-core" id="gfx-create" type="button" data-i18n="graphics.createBtn"></button>
          <span class="muted" id="gfx-msg" style="margin-inline-start:8px"></span>
        </div>
        <div class="card">
          <h2 data-i18n="graphics.list"></h2>
          <div id="gfx-list" class="list"></div>
        </div>
        <div class="card" id="gfx-preview" hidden>
          <h2 data-i18n="graphics.preview"></h2>
          <div id="gfx-svg" class="tech"></div>
        </div>
      </section>

      <!-- Observed -->
      <section class="glass view view-pad" id="view-observed">
        <h2 data-i18n="ui.observedTimeline"></h2>
        <div class="muted" data-i18n="ui.observedSafety"></div>
        <div class="row-inline" style="margin-top:10px">
          <button class="ok" id="obs-ingest" type="button" data-i18n="ui.observedIngest"></button>
          <span class="muted" id="obs-msg"></span>
        </div>
        <div class="muted" id="obs-state" style="margin-top:8px"></div>
        <div id="obs-list" class="list" style="margin-top:10px"></div>
      </section>

      <!-- Diagnostics -->
      <section class="glass view view-pad diag" id="view-diag">
        <h2 data-i18n="diag.title"></h2>
        <div class="muted" data-i18n="diag.hint"></div>
        <pre id="diag" class="feed">—</pre>
        <button id="diag-clear" type="button" class="pill-btn" data-i18n="diag.clear"></button>
      </section>

    </main>

    <!-- ================= right column: approval gate ================= -->
    <aside class="col-right">
      <section class="glass gate" id="gate">
        <div class="gate-head">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="gate-icon"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
          <h2 class="disp" data-i18n="approvals.box"></h2>
          <span class="count mono" id="gate-count">0</span>
          <span class="q" data-i18n="approvals.queue"></span>
        </div>
        <div class="gate-body" id="approvals"></div>
      </section>
    </aside>

    <!-- ================= flight log (event feed) ================= -->
    <section class="glass logrow" id="flightlog">
      <div class="log-head">
        <h2 class="disp" data-i18n="feed.title"></h2>
        <div class="log-controls">
          <select id="feed-filter" aria-label="Filter">
            <option value="all" data-i18n="feed.all"></option>
            <option value="info" data-i18n="feed.info"></option>
            <option value="warn" data-i18n="feed.warn"></option>
            <option value="error" data-i18n="feed.error"></option>
            <option value="security" data-i18n="feed.security"></option>
          </select>
          <button id="feed-follow" class="pill-btn" type="button" data-i18n="log.follow"></button>
          <button id="feed-play" class="pill-btn" type="button" data-i18n="log.replay"></button>
        </div>
      </div>
      <div id="feed" class="logcards scroll">—</div>
      <div class="scrub">
        <button id="feed-play2" class="pill-btn" type="button" aria-label="Replay" style="width:38px;height:34px;border-radius:999px;padding:0">▶</button>
        <div class="bar">
          <div class="track"></div>
          <div class="fill" id="scrub-fill" style="width:0"></div>
          <div class="cursor" id="scrub-cursor" style="left:0"></div>
        </div>
        <span class="pos" id="scrub-pos">LIVE</span>
      </div>
    </section>

  </div>
</div>

<div id="toast"></div>

const DEFAULT_LANG = "en";
let LANG = DEFAULT_LANG;

function t(key) {
  const table = I18N[LANG] || I18N[DEFAULT_LANG];
  if (Object.prototype.hasOwnProperty.call(table, key)) return table[key];
  const fallback = I18N[DEFAULT_LANG];
  if (Object.prototype.hasOwnProperty.call(fallback, key)) return fallback[key];
  return key;
}

let DATA_ON_SCREEN = false;

function applyI18n(root) {
  const scope = root || document;
  document.title = t("app.title");
  scope.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    if (key) el.textContent = t(key);
  });
  scope.querySelectorAll("[data-i18n-attr]").forEach((el) => {
    const spec = el.getAttribute("data-i18n-attr") || "";
    spec.split("|").forEach((pair) => {
      const idx = pair.indexOf(":");
      if (idx < 0) return;
      const attr = pair.slice(0, idx).trim();
      const key = pair.slice(idx + 1).trim();
      if (attr && key) el.setAttribute(attr, t(key));
    });
  });
}

const LANG_STORE_KEY = "agent_os_lang";
const TOKEN_STORE_KEY = "agent_os_token";
const OBS_SOURCE_KEY = "agent_os_obs_source";
let OBS_SOURCE = readStore(OBS_SOURCE_KEY) || "";
let OBS_CURSOR = 0;
function readStore(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function writeStore(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* storage disabled */ }
}
function loadLang() {
  const saved = readStore(LANG_STORE_KEY);
  if (saved && Object.prototype.hasOwnProperty.call(I18N, saved)) return saved;
  return DEFAULT_LANG;
}
function persistLang(lang) { writeStore(LANG_STORE_KEY, lang); }

function syncLangSelect() {
  const el = $("lang-select");
  if (el && el.value !== LANG) el.value = LANG;
}

function setLang(lang) {
  LANG = Object.prototype.hasOwnProperty.call(I18N, lang) ? lang : DEFAULT_LANG;
  document.documentElement.lang = LANG === "fa" ? "fa" : "en";
  document.documentElement.dir = LANG === "fa" ? "rtl" : "ltr";
  document.body.className = LANG === "fa" ? "f-fa" : "f-en";
  persistLang(LANG);
  syncLangSelect();
  if (typeof applyI18n === "function") applyI18n();
  if (typeof _labelProjectForm === "function") _labelProjectForm();
  if (typeof setConnectionState === "function") setConnectionState(CURRENT_CONN_STATE);
  if (DATA_ON_SCREEN && typeof refresh === "function") {
    try { refresh(); } catch (e) { /* refresh reports its own failures */ }
  }
  return LANG;
}

function localeFor() {
  return LANG === "fa" ? "fa-IR" : "en-US";
}

const UI_LOG_CAP = 200;
const UI_LOG = [];
let UI_LOG_DIRTY = false;

function _safeSanitize(str) {
  if (!str) return "";
  let s = String(str);
  if (TOKEN && TOKEN.length >= 4) {
    s = s.split(TOKEN).join("[REDACTED]");
  }
  return s.replace(/Bearer\s+[A-Za-z0-9_\-\.]+/gi, "Bearer [REDACTED]");
}

function _errText(e) {
  if (!e) return "unknown error";
  if (typeof e === "string") return _safeSanitize(e);
  return _safeSanitize(e.message || e.name || String(e));
}

function uiLog(level, message, fields) {
  const safeMsg = _safeSanitize(message);
  const entry = {
    at: new Date().toISOString().slice(11, 23),
    level: level || "error",
    message: safeMsg,
  };
  let safeFields = null;
  if (fields) {
    safeFields = {};
    const ALLOW = ["status", "path", "detail", "reason"];
    for (const k of ALLOW) {
      if (k in fields) {
        const v = fields[k];
        if (typeof v === "string" || typeof v === "number" || typeof v === "boolean") {
          const safeVal = typeof v === "string" ? _safeSanitize(v) : v;
          entry[k] = safeVal;
          safeFields[k] = safeVal;
        }
      }
    }
  }
  UI_LOG.push(entry);
  while (UI_LOG.length > UI_LOG_CAP) UI_LOG.shift();
  UI_LOG_DIRTY = true;
  const line = `${entry.at} ${entry.level.toUpperCase()} ${entry.message}`;
  if (entry.level === "error") console.error(line, safeFields || "");
  else console.warn(line, safeFields || "");
  const el = $("diag");
  if (el) el.textContent = UI_LOG.length
    ? UI_LOG.map((r) => `${r.at} ${r.level.toUpperCase().padEnd(5)} ${r.message}`
        + (r.detail ? `  (${r.detail})` : "")
        + (r.path ? `  [${r.status ?? "?"} ${r.path}]` : "")).join("\n")
    : "—";
}

function uiLogClear() {
  UI_LOG.length = 0;
  UI_LOG_DIRTY = false;
  const el = $("diag");
  if (el) el.textContent = "—";
}

const $ = (id) => document.getElementById(id);
let TOKEN = readStore(TOKEN_STORE_KEY) || "";
let selectedMission = null;
let selectedJob = null;

$("token").value = TOKEN;

const DEFAULT_TIMEOUT_MS = 8000;

async function api(method, path, body, options = {}) {
  const upperMethod = String(method || "GET").toUpperCase();
  const isBodyless = upperMethod === "GET" || upperMethod === "HEAD";
  let realBody = body;
  let realOpts = options;
  if (isBodyless && body && (body.signal || body.timeoutMs || body.headers)) {
    realOpts = body;
    realBody = undefined;
  }

  const timeoutMs = typeof realOpts.timeoutMs === "number" ? realOpts.timeoutMs : DEFAULT_TIMEOUT_MS;
  const controller = new AbortController();
  let timedOut = false;
  const timer = setTimeout(() => {
    timedOut = true;
    controller.abort();
  }, timeoutMs);

  if (realOpts.signal) {
    if (realOpts.signal.aborted) {
      clearTimeout(timer);
      controller.abort();
    } else {
      realOpts.signal.addEventListener("abort", () => {
        clearTimeout(timer);
        controller.abort();
      }, { once: true });
    }
  }

  const headers = {};
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  if (realOpts.headers) Object.assign(headers, realOpts.headers);

  let fetchBody = undefined;
  if (!isBodyless && realBody !== undefined) {
    headers["Content-Type"] = "application/json";
    fetchBody = JSON.stringify(realBody);
  }

  let resp;
  try {
    resp = await fetch(path, {
      method: upperMethod,
      headers,
      body: fetchBody,
      signal: controller.signal,
    });
  } catch (err) {
    clearTimeout(timer);
    if (timedOut) {
      const e = new Error(`Request timed out after ${timeoutMs}ms`);
      e.name = "TimeoutError";
      e.isTimeout = true;
      e.path = `${upperMethod} ${path}`;
      uiLog("warn", `request timeout: ${upperMethod} ${path} (${timeoutMs}ms)`);
      throw e;
    }
    if (controller.signal.aborted || (realOpts.signal && realOpts.signal.aborted)) {
      const e = new Error("Request aborted");
      e.name = "AbortError";
      e.isAbort = true;
      e.path = `${upperMethod} ${path}`;
      throw e;
    }
    const safeMsg = _safeSanitize(err && err.message ? err.message : String(err));
    const e = new Error(safeMsg);
    e.name = err && err.name ? err.name : "FetchError";
    e.path = `${upperMethod} ${path}`;
    uiLog("warn", `network error: ${upperMethod} ${path}`, { detail: safeMsg });
    throw e;
  } finally {
    clearTimeout(timer);
  }

  const data = await resp.json().catch(() => {
    uiLog("warn", "response body was not JSON", {
      status: resp.status,
      path: `${upperMethod} ${path}`,
    });
    return {};
  });

  if (!resp.ok) {
    const errObj = (data && data.error) || {};
    const rawMsg = errObj.message || ("HTTP " + resp.status);
    const safeMsg = _safeSanitize(rawMsg);
    const e = new Error(safeMsg);
    e.status = resp.status;
    e.reason = errObj.reason || "";
    e.path = `${upperMethod} ${path}`;
    throw e;
  }
  return data;
}

function toast(msg, ok) {
  const el = $("toast");
  el.textContent = _safeSanitize(msg);
  el.className = ok ? "okk" : "badd";
  el.style.display = "block";
  clearTimeout(el._h);
  el._h = setTimeout(() => (el.style.display = "none"), 3000);
}

function badge(state) {
  return `<span class="badge b-${state}">${state}</span>`;
}

function escapeHtml(s) {
  return String(s === undefined || s === null ? "" : s)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}

let LAST_SUCCESS_TIME = null;
let CURRENT_CONN_STATE = "disconnected";

function formatTime(ts) {
  if (!ts) return "—";
  try {
    return new Date(ts).toLocaleTimeString(localeFor());
  } catch (err) {
    return "—";
  }
}

function setConnectionState(state) {
  CURRENT_CONN_STATE = state;
  const connEl = $("conn");
  const dotEl = document.querySelector(".top .dotlive");

  let text = "";
  let color = "var(--sun)";
  let isLive = false;

  switch (state) {
    case "connected":
      text = t("conn.connected");
      color = "var(--ok)";
      isLive = true;
      break;
    case "stale":
      text = t("conn.stale").replace("{time}", formatTime(LAST_SUCCESS_TIME));
      color = "var(--sun)";
      isLive = false;
      break;
    case "disconnected":
      text = t("conn.disconnected");
      color = "var(--bad)";
      isLive = false;
      break;
    case "token_required":
      text = t("conn.needToken");
      color = "var(--sun)";
      isLive = false;
      break;
    case "forbidden":
      text = t("conn.forbidden");
      color = "var(--bad)";
      isLive = false;
      break;
    case "unavailable":
      text = t("conn.unavailable");
      color = "var(--bad)";
      isLive = false;
      break;
    default:
      text = t("conn.connecting");
      color = "var(--sun)";
      isLive = false;
  }

  if (connEl) {
    connEl.textContent = text;
    connEl.style.color = color;
  }
  if (dotEl) {
    dotEl.style.background = color;
    dotEl.style.color = color;
    dotEl.style.animation = isLive ? "" : "none";
    dotEl.style.opacity = isLive ? "1" : "0.7";
  }
}

function handleRefreshError(e) {
  uiLog("error", "refresh failed", { detail: _errText(e), status: e.status });
  if (e.status === 401) {
    setConnectionState("token_required");
  } else if (e.status === 403) {
    setConnectionState("forbidden");
  } else if (e.status === 502 || e.status === 503 || e.status === 504) {
    setConnectionState("unavailable");
  } else {
    if (DATA_ON_SCREEN && LAST_SUCCESS_TIME) {
      setConnectionState("stale");
    } else {
      setConnectionState("disconnected");
    }
  }
}

async function connect() {
  TOKEN = $("token").value.trim();
  writeStore(TOKEN_STORE_KEY, TOKEN);
  if (!TOKEN) {
    setConnectionState("token_required");
    return;
  }
  setConnectionState("connecting");
  try {
    await api("GET", "/api/status");
    LAST_SUCCESS_TIME = Date.now();
    setConnectionState("connected");
  } catch (e) {
    uiLog("error", "connect failed", { detail: _errText(e), status: e.status });
    if (e.status === 401) setConnectionState("token_required");
    else if (e.status === 403) setConnectionState("forbidden");
    else if (e.status === 502 || e.status === 503 || e.status === 504) setConnectionState("unavailable");
    else setConnectionState("disconnected");
    throw e;
  }
}

async function loadStatus() {
  const opts = arguments[0];
  const s = await api("GET", "/api/status", undefined, opts);
  $("db-pill").textContent = s.db_path || "—";
  $("active-mission").textContent = s.version ? ("v" + s.version) : "—";
  const info = $("sys-info");
  if (info) {
    info.textContent = "";
    const ver = document.createElement("span");
    ver.textContent = t("sys.version") + " " + (s.version || "—");
    const ex = document.createElement("span");
    ex.textContent = t("sys.executors") + " "
      + ((s.executors || []).join(", ") || t("sys.none"));
    info.appendChild(ver);
    info.appendChild(ex);
    const db = document.createElement("span");
    db.textContent = t("sys.db") + " " + (s.db_path || "—");
    info.appendChild(db);
  }
}

// ============================================================
//  NEURAL SCENE — canvas 2D port of the Neural Command design
//  core = the system, mission nodes on the fiber, job children
// ============================================================
const SCENE = {
  missions: [], jobsByMission: {}, pendingByJob: {},
  selectedMission: null, selectedJob: null, query: "",
  W: 800, H: 520, dpr: 1, backdrop: null,
  nodes: {}, fibers: [], fiberDefs: [], raf: 0, last: 0,
  // spring-physics layout: pos/vel integrate toward targets each frame;
  // pins are user-dragged anchors; drag is the live pointer drag
  pos: {}, pins: {}, drag: null, hover: null, _pt: 0,
};

const STATE_COLORS = {
  draft: "#6b7fa6", proposed: "#6b7fa6",
  active: "#4fd6ff", running: "#4fd6ff", approved: "#4fd6ff", dispatched: "#4fd6ff",
  awaiting_approval: "#ff9a52", completed_unverified: "#ffd166",
  completed_verified: "#5ff0a8", completed: "#5ff0a8",
  failed: "#ff5c7a", interrupted_unknown: "#c77dff",
  closed: "#6b7fa6", offline: "#6b7fa6",
};
const CORE_COLOR = "#38e8ff";

function sceneColor(key) {
  // missionNodeState reports "awaiting"; the palette key is "awaiting_approval"
  return STATE_COLORS[key === "awaiting" ? "awaiting_approval" : key] || "#6b7fa6";
}

function missionNodeState(m) {
  const jobs = SCENE.jobsByMission[m.id] || [];
  if (jobs.some((j) => j.state === "awaiting_approval")
      || SCENE.pendingByJob[m.id]) return "awaiting";
  return m.state === "active" ? "running" : "offline";
}

function bez(a, c1, c2, b, n = 42) {
  const out = new Float32Array((n + 1) * 2);
  for (let i = 0; i <= n; i++) {
    const s = i / n, d = 1 - s;
    out[i * 2] = d*d*d*a.x + 3*d*d*s*c1.x + 3*d*s*s*c2.x + s*s*s*b.x;
    out[i * 2 + 1] = d*d*d*a.y + 3*d*d*s*c1.y + 3*d*s*s*c2.y + s*s*s*b.y;
  }
  return out;
}
function strandAt(strand, t) {
  const n = strand.length / 2 - 1;
  const f = Math.max(0, Math.min(n, t * n));
  const i = Math.floor(f), r = f - i;
  const j = Math.min(n, i + 1);
  return [strand[i*2] + (strand[j*2] - strand[i*2]) * r,
          strand[i*2+1] + (strand[j*2+1] - strand[i*2+1]) * r];
}
function hexA(hex, a) {
  const v = parseInt(hex.replace("#", ""), 16);
  return `rgba(${v >> 16 & 255},${v >> 8 & 255},${v & 255},${a})`;
}

function paintBackdrop(W, H, dpr) {
  const c = document.createElement("canvas");
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext("2d");
  g.scale(dpr, dpr);
  const bg = g.createRadialGradient(W / 2, H * .47, 0, W / 2, H * .47, Math.max(W, H) * .75);
  bg.addColorStop(0, "#0a2236"); bg.addColorStop(.5, "#061423"); bg.addColorStop(1, "#02070f");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.filter = "blur(2.5px)";
  for (let i = 0; i < 170; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    if (Math.hypot(x - W / 2, y - H * .47) < Math.min(W, H) * .3) continue;
    const w = 3 + Math.random() * 9, h = 2 + Math.random() * 4;
    const warm = Math.random() < .18;
    g.fillStyle = warm ? `rgba(255,214,160,${.05 + Math.random() * .12})`
                       : `rgba(150,225,255,${.05 + Math.random() * .16})`;
    g.fillRect(x, y, w, h);
  }
  g.filter = "none";
  g.strokeStyle = "rgba(90,200,255,.045)"; g.lineWidth = 1;
  for (let x = 0; x < W; x += 32) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke(); }
  for (let y = 0; y < H; y += 32) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W, y + .5); g.stroke(); }
  const vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .8);
  vig.addColorStop(0, "rgba(2,6,14,0)"); vig.addColorStop(1, "rgba(2,6,14,.85)");
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
  return c;
}

function strandsBetween(a, b, count, spread) {
  const out = [];
  for (let i = 0; i < count; i++) {
    const o = (i - (count - 1) / 2) * spread;
    const m1 = { x: a.x + (b.x - a.x) * .3, y: a.y + (b.y - a.y) * .16 + o };
    const m2 = { x: a.x + (b.x - a.x) * .72, y: a.y + (b.y - a.y) * .84 + o * .4 };
    out.push(bez(a, m1, m2, b));
  }
  return out;
}

// layoutScene only computes TARGETS; stepScene() springs the live positions
// toward them, so new nodes fly out of the core and re-layouts glide.
function layoutScene() {
  const W = SCENE.W, H = SCENE.H;
  const C = { x: W / 2, y: H * .47 };
  const nodes = {};
  const ms = SCENE.missions;
  const L = [], R = [];
  ms.forEach((m, i) => ((L.length <= R.length) ? L : R).push(m));
  const put = (arr, side) => arr.forEach((m, i) => {
    const y = H * (.18 + .64 * (arr.length === 1 ? .5 : i / (arr.length - 1)));
    const p = (y - C.y) / (H * .4);
    const inset = 110 + p * p * W * .05;
    const x = side === -1 ? inset : W - inset;
    nodes[m.id] = { x, y, side, kind: "mission", ref: m };
  });
  put(L, -1); put(R, 1);
  const sel = SCENE.selectedMission;
  if (sel && nodes[sel]) {
    const jobs = SCENE.jobsByMission[sel] || [];
    const base = nodes[sel];
    const toward = -base.side; // toward the core column
    jobs.forEach((j, i) => {
      const n = jobs.length;
      const ox = toward * (110 + (n > 3 ? 30 : 0));
      const oy = (n === 1 ? 0 : (i - (n - 1) / 2) * Math.min(44, (H * .6) / n));
      nodes["job:" + j.id] = {
        x: base.x + ox, y: base.y + oy, side: toward, kind: "job", ref: j,
        parent: sel, ox, oy,
      };
    });
  }
  nodes.core = { x: C.x, y: C.y, side: 0, kind: "core" };
  SCENE.nodes = nodes;

  // seed spring positions: unseen nodes start at the core and fly outward
  Object.keys(nodes).forEach((id) => {
    if (!SCENE.pos[id]) SCENE.pos[id] = { x: C.x, y: C.y, vx: 0, vy: 0 };
  });
  Object.keys(SCENE.pos).forEach((id) => { if (!nodes[id]) delete SCENE.pos[id]; });
  Object.keys(SCENE.pins).forEach((id) => {
    if (!nodes[id] || id === "core") delete SCENE.pins[id];
  });

  SCENE.fiberDefs = ms.map((m) => ({
    from: "core", to: m.id, id: m.id,
    state: missionNodeState(m), count: 3, spread: 16,
  }));
  if (sel) for (const j of SCENE.jobsByMission[sel] || []) {
    SCENE.fiberDefs.push({
      from: sel, to: "job:" + j.id, id: "job:" + j.id,
      state: j.state === "awaiting_approval" ? "awaiting_approval" : j.state,
      count: 1, spread: 8,
    });
  }
  placeOverlays();
}

// one physics tick: integrate every node toward its target. Job nodes target
// their parent's LIVE position plus a stored offset, so dragging a mission
// carries its children; a pin overrides everything (that is the drop anchor).
function stepScene(now) {
  const dt = Math.min(.05, Math.max(0, (now - (SCENE._pt || now)) / 1000)) || .016;
  SCENE._pt = now;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const k = reduced ? 500 : 60;   // stiffness (slightly under-damped -> glide)
  const d = reduced ? 44 : 11;    // damping
  const W = SCENE.W, H = SCENE.H;
  for (const [id, n] of Object.entries(SCENE.nodes)) {
    let tx, ty;
    const pin = SCENE.pins[id];
    if (pin) { tx = pin.x; ty = pin.y; }
    else if (n.parent && SCENE.pos[n.parent]) {
      const par = SCENE.pos[n.parent];
      tx = par.x + n.ox; ty = par.y + n.oy;
    } else { tx = n.x; ty = n.y; }
    tx = Math.max(46, Math.min(W - 46, tx));
    ty = Math.max(40, Math.min(H - 40, ty));
    const p = SCENE.pos[id];
    if (!p) continue;
    p.vx += ((tx - p.x) * k - p.vx * d) * dt;
    p.vy += ((ty - p.y) * k - p.vy * d) * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.x = Math.max(24, Math.min(W - 24, p.x));
    p.y = Math.max(24, Math.min(H - 24, p.y));
  }
  const C = { x: W / 2, y: H * .47 };
  SCENE.fibers = SCENE.fiberDefs.map((f) => ({
    ...f,
    strands: strandsBetween(SCENE.pos[f.from] || C, SCENE.pos[f.to] || C,
                            f.count, f.spread),
  }));
  // a hover that lost its fiber must not leave a ghost tooltip behind
  if (SCENE.hover && !SCENE.fiberDefs.some((fd) => fd.id === SCENE.hover.id)) {
    fiberTipHide();
  }
}

function matchQuery(m) {
  const q = SCENE.query.trim().toLowerCase();
  if (!q) return true;
  const jobs = SCENE.jobsByMission[m.id] || [];
  return m.title.toLowerCase().includes(q) || m.id.toLowerCase().includes(q)
    || jobs.some((j) => (j.title || "").toLowerCase().includes(q));
}

function dimNode(id) {
  const q = SCENE.query.trim().toLowerCase();
  if (q) {
    if (id === "core") return false;
    const m = SCENE.missions.find((x) => x.id === id);
    if (m && matchQuery(m)) return false;
    if (id.startsWith("job:")) {
      const j = (SCENE.jobsByMission[SCENE.selectedMission] || []).find((x) => "job:" + x.id === id);
      if (j && (j.title || "").toLowerCase().includes(q)) return false;
    }
    return true;
  }
  return false;
}

function drawScene(now) {
  const canvas = $("scene-canvas");
  if (!canvas) return;
  const g = canvas.getContext("2d");
  const { W, H, dpr } = SCENE;
  const slow = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? .25 : 1;
  stepScene(now); // spring-integrate node positions, then rebuild fibers
  const t = (now - SCENE.last) / 1000 * slow;
  SCENE.raf = requestAnimationFrame(drawScene);
  if (!SCENE.backdrop) return;

  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.globalCompositeOperation = "source-over";
  g.drawImage(SCENE.backdrop, 0, 0, W, H);
  g.globalCompositeOperation = "lighter";

  const nodes = SCENE.nodes;
  const stroke = (pts, color, alpha, width) => {
    g.strokeStyle = hexA(color, alpha); g.lineWidth = width;
    g.beginPath(); g.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
    g.stroke();
  };
  const comet = (strand, tt, color, r, a) => {
    const [x, y] = strandAt(strand, tt);
    const glow = g.createRadialGradient(x, y, 0, x, y, r * 5);
    glow.addColorStop(0, hexA("#ffffff", a * .9));
    glow.addColorStop(.3, hexA(color, a * .5));
    glow.addColorStop(1, hexA(color, 0));
    g.fillStyle = glow;
    g.beginPath(); g.arc(x, y, r * 5, 0, Math.PI * 2); g.fill();
  };

  // fibers + comets
  SCENE.fibers.forEach((f, fi) => {
    const dim = dimNode(f.to);
    const sel = f.to === SCENE.selectedMission || f.to === SCENE.selectedJob;
    const hov = !!SCENE.hover && SCENE.hover.id === f.id;
    const color = f.state === "awaiting_approval" ? STATE_COLORS.awaiting_approval : sceneColor(f.state);
    const offline = f.state === "offline" || f.state === "draft";
    if (offline) g.setLineDash([4, 7]);
    f.strands.forEach((s, si) => {
      const mid = si === Math.floor(f.strands.length / 2);
      const a = dim ? .05 : (hov ? .95 : (sel ? .6 : .26));
      stroke(s, "#5ff0a8", a * .25, mid ? 3.5 : 2);
      stroke(s, color, a, mid ? (hov ? 2.6 : 1.6) : 1);
    });
    g.setLineDash([]);
    if (!offline && !dim) {
      const speed = f.state === "awaiting_approval" ? .16 : .34;
      f.strands.forEach((s, si) => {
        if (si % 2) return;
        let tt = (now / 1000 * speed * slow + si * .21 + (f.id.length % 5) * .13) % 1;
        let cc = color, aa = sel ? 1 : .75;
        if (f.state === "awaiting_approval" && tt > .62) {
          tt = .62; aa *= .6 + Math.sin(now / 160) * .4;
        }
        comet(s, tt, cc, 1.8, aa);
      });
    }
  });

  // mission nodes
  Object.entries(nodes).forEach(([id, n]) => {
    if (n.kind === "core") return;
    const live = SCENE.pos[id] || n;
    const dim = dimNode(id);
    const color = n.kind === "mission" ? sceneColor(missionNodeState(n.ref)) : sceneColor(n.ref.state);
    const isJob = n.kind === "job";
    const b = (isJob ? .55 : 1) * (SCENE.selectedMission === id ? 1.18 : 1);
    const alpha = dim ? .15 : (n.ref.state === "offline" || n.ref.state === "draft" ? .5 : 1);
    g.strokeStyle = hexA(color, .75 * alpha);
    g.lineWidth = 2;
    g.setLineDash([14 * b, 8 * b]);
    g.lineDashOffset = (n.ref.state === "offline" || n.ref.state === "draft") ? 0 : -now / 50;
    g.beginPath(); g.ellipse(live.x, live.y, 20 * b, 20 * b, 0, 0, Math.PI * 2); g.stroke();
    g.setLineDash([]);
    g.strokeStyle = hexA(color, .4 * alpha); g.lineWidth = 1;
    g.beginPath(); g.arc(live.x, live.y, 13 * b, 0, Math.PI * 2); g.stroke();
    const halo = g.createRadialGradient(live.x, live.y, 0, live.x, live.y, 26 * b);
    halo.addColorStop(0, hexA(color, .55 * alpha)); halo.addColorStop(1, hexA(color, 0));
    g.fillStyle = halo;
    g.beginPath(); g.arc(live.x, live.y, 26 * b, 0, Math.PI * 2); g.fill();
    // drag feedback: solid ring while dragging, soft amber pin ring when anchored
    if ((SCENE.drag && SCENE.drag.id === id) || SCENE.pins[id]) {
      const pinned = !!SCENE.pins[id];
      g.strokeStyle = hexA(pinned ? "#ffd166" : color, pinned ? .8 : .55);
      g.lineWidth = 1.4;
      g.setLineDash(pinned ? [5, 4] : []);
      g.beginPath();
      g.arc(live.x, live.y, (30 + Math.sin(now / 260) * 2) * b, 0, Math.PI * 2);
      g.stroke();
      g.setLineDash([]);
    }
  });

  // core
  const C = nodes.core; const R = Math.min(W, H) * .13;
  const coreY = C.y - R * 1.5;
  const ring = (x, y, rx, ry, a, w, dash, off) => {
    g.strokeStyle = hexA(CORE_COLOR, a); g.lineWidth = w;
    if (dash) { g.setLineDash(dash); g.lineDashOffset = off; }
    g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.stroke();
    g.setLineDash([]);
  };
  ring(C.x, coreY, R * 1.9, R * .34, .16, 1.2, null, 0);
  ring(C.x, coreY, R * 1.45, R * .24, .3, 2, [R * .9, R * .3, R * .2, R * .4], now / 22);
  ring(C.x, coreY + R * .06, R * .8, R * .12, .45, 1.5, [8, 6], -now / 30);
  const ped = g.createLinearGradient(0, C.y + R * .6, 0, coreY + R * 1.7);
  ped.addColorStop(0, "rgba(56,232,255,0)"); ped.addColorStop(1, "rgba(56,232,255,.22)");
  g.fillStyle = ped;
  g.beginPath();
  g.moveTo(C.x - R * .35, C.y + R * .9); g.lineTo(C.x + R * .35, C.y + R * .9);
  g.lineTo(C.x + R * .8, coreY + R * 1.42); g.lineTo(C.x - R * .8, coreY + R * 1.42);
  g.fill();
  ring(C.x, coreY + R * 1.42, R * .8, R * .16, .7, 2.2, null, 0);
  ring(C.x, coreY + R * 1.48, R * 1.35, R * .27, .32, 1.4, [R * .6, R * .15], -now / 18);
  ring(C.x, coreY + R * 1.52, R * 2.1, R * .42, .14, 1, [3, 9], now / 10);
  const glow = g.createRadialGradient(C.x, coreY + R * 1.42, 0, C.x, coreY + R * 1.42, R * .9);
  glow.addColorStop(0, "rgba(120,240,255,.45)"); glow.addColorStop(1, "rgba(56,232,255,0)");
  g.fillStyle = glow;
  g.beginPath(); g.ellipse(C.x, coreY + R * 1.42, R * .9, R * .2, 0, 0, Math.PI * 2); g.fill();
  const pulse = 1 + Math.sin(now / 400) * .04;
  const head = g.createRadialGradient(C.x, coreY, 0, C.x, coreY, R * pulse);
  head.addColorStop(0, "rgba(232,254,255,.9)");
  head.addColorStop(.35, "rgba(56,232,255,.55)");
  head.addColorStop(.75, "rgba(56,232,255,.12)");
  head.addColorStop(1, "rgba(56,232,255,0)");
  g.fillStyle = head;
  g.beginPath(); g.arc(C.x, coreY, R * pulse, 0, Math.PI * 2); g.fill();
  ring(C.x, coreY, R * .62, R * .62, .35, 1.6, [6, 5], -now / 14);
  const sweep = g.createLinearGradient(C.x - W * .44, 0, C.x + W * .44, 0);
  sweep.addColorStop(0, hexA("#c77dff", 0)); sweep.addColorStop(.4, hexA("#c77dff", .5));
  sweep.addColorStop(.5, hexA("#c77dff", .12)); sweep.addColorStop(.6, hexA("#c77dff", .5));
  sweep.addColorStop(1, hexA("#c77dff", 0));
  g.strokeStyle = sweep; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(C.x - W * .44, C.y + R * .05); g.lineTo(C.x + W * .44, C.y + R * .05); g.stroke();
}

function placeOverlays() {
  const wrap = $("scene-wrap");
  const host = $("scene-overlay");
  if (!wrap || !host) return;
  const rtl = LANG === "fa";
  const dir = rtl ? "rtl" : "ltr";
  Object.entries(SCENE.nodes).forEach(([id, n]) => {
    let label = host.querySelector(`[data-node="${id}"]`);
    if (!label) {
      label = document.createElement("div");
      label.className = "node-label";
      label.dataset.node = id;
      const btn = document.createElement("button");
      btn.className = "hit" + (id === "core" ? " core-hit" : "");
      btn.dataset.hit = id;
      btn.addEventListener("click", () => nodeClicked(id));
      btn.addEventListener("pointerdown", (ev) => nodeDragStart(ev, id));
      host.appendChild(label);
      host.appendChild(btn);
    }
    const btn = host.querySelector(`[data-hit="${id}"]`);
    let color, title, sub, stateKey;
    if (id === "core") {
      color = CORE_COLOR;
      title = "Agent OS";
      sub = t("app.section");
      stateKey = null;
      label.classList.add("core-tag");
      label.innerHTML = "";
      const em = document.createElement("em");
      em.textContent = "Agent OS";
      label.appendChild(em);
      label.appendChild(document.createTextNode("· " + t("app.section")));
    } else {
      const isJob = n.kind === "job";
      color = isJob ? sceneColor(n.ref.state) : sceneColor(missionNodeState(n.ref));
      stateKey = isJob ? n.ref.state : missionNodeState(n.ref);
      title = n.ref.title || n.ref.id;
      sub = isJob
        ? (t("job.executor") + ": " + (n.ref.executor || "—"))
        : ((SCENE.jobsByMission[id] || []).length + " " + t("graph.jobs"));
      label.classList.remove("core-tag");
      label.className = "node-label";
      label.dir = dir;
      const b = document.createElement("b");
      b.textContent = title;
      const small = document.createElement("small");
      small.textContent = sub;
      const st = document.createElement("span");
      st.className = "st";
      st.style.color = color;
      const dot = document.createElement("i");
      dot.style.background = color;
      st.appendChild(dot);
      st.appendChild(document.createTextNode(stateLabel(stateKey)));
      label.appendChild(b); label.appendChild(small); label.appendChild(st);
    }
    // follow the LIVE spring position, not the layout target
    const live = SCENE.pos[id] || n;
    const right = n.side === 1;
    const lx = right ? SCENE.W - live.x - 30 : live.x + 30;
    const ly = n.kind === "core" ? live.y + 64 : live.y + 28;
    label.style.left = (n.kind === "core" ? live.x : (right ? lx : lx)) + "px";
    label.style.top = ly + "px";
    if (n.kind === "core") { label.style.left = live.x + "px"; }
    label.style.textAlign = n.kind === "core" ? "center" : (right ? "right" : "left");
    label.style.opacity = dimNode(id) ? .25 : 1;
    if (btn) {
      btn.style.left = (live.x - (id === "core" ? 60 : 26)) + "px";
      btn.style.top = (live.y - (id === "core" ? 55 : 26)) + "px";
      btn.setAttribute("aria-label", title);
    }
  });
  // remove stale overlays
  host.querySelectorAll("[data-node]").forEach((el) => {
    if (!SCENE.nodes[el.dataset.node]) el.remove();
  });
  host.querySelectorAll("[data-hit]").forEach((el) => {
    if (!SCENE.nodes[el.dataset.hit]) el.remove();
  });
  wrap.dataset.rtl = rtl ? "1" : "0";
}

function stateLabel(key) {
  if (key === "running" || key === "active") return t("legend.active");
  if (key === "awaiting" || key === "awaiting_approval") return t("legend.awaiting");
  if (key === "complete" || key === "completed" || key === "completed_verified") return t("legend.complete");
  if (key === "failed") return t("legend.failed");
  return t("legend.offline");
}

function nodeClicked(id) {
  if (SCENE.dragJustMoved) { SCENE.dragJustMoved = false; return; }
  if (id === "core") { selectMission(null); return; }
  if (id.startsWith("job:")) {
    const j = (SCENE.jobsByMission[SCENE.selectedMission] || [])
      .find((x) => "job:" + x.id === id);
    if (j) showJob(j);
    return;
  }
  selectMission(id === SCENE.selectedMission ? null : id);
}

// ---- node dragging: press to arrange, release to pin; click still inspects
function nodeDragStart(ev, id) {
  if (id === "core") return;
  if (ev.button !== undefined && ev.button !== 0) return;
  const live = SCENE.pos[id];
  if (!live) return;
  ev.preventDefault();
  SCENE.dragJustMoved = false; // a new gesture may click again
  SCENE.drag = {
    id, moved: false,
    sx: ev.clientX, sy: ev.clientY,
    dx: ev.clientX - live.x, dy: ev.clientY - live.y,
  };
  const btn = document.querySelector(`[data-hit="${id}"]`);
  if (btn) btn.classList.add("dragging");
  window.addEventListener("pointermove", nodeDragMove, { passive: false });
  window.addEventListener("pointerup", nodeDragEnd);
  window.addEventListener("pointercancel", nodeDragEnd);
}

function nodeDragMove(ev) {
  const drag = SCENE.drag;
  const p = drag && SCENE.pos[drag.id];
  if (!p) return;
  if (!drag.moved) {
    // 4px threshold separates a click from a drag; the node always tracks
    // the pointer 1:1 from the grab point (dx/dy are the grab offsets)
    if (Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 4) return;
    drag.moved = true;
  }
  ev.preventDefault();
  p.x = Math.max(24, Math.min(SCENE.W - 24, ev.clientX - drag.dx));
  p.y = Math.max(24, Math.min(SCENE.H - 24, ev.clientY - drag.dy));
  p.vx = 0; p.vy = 0;
}

function nodeDragEnd(ev) {
  const drag = SCENE.drag;
  SCENE.drag = null;
  window.removeEventListener("pointermove", nodeDragMove);
  window.removeEventListener("pointerup", nodeDragEnd);
  window.removeEventListener("pointercancel", nodeDragEnd);
  if (!drag) return;
  const btn = document.querySelector(`[data-hit="${drag.id}"]`);
  if (btn) btn.classList.remove("dragging");
  if (!drag.moved) return; // plain click: let the click handler inspect
  SCENE.dragJustMoved = true;
  const wrap = $("scene-wrap");
  const rect = wrap ? wrap.getBoundingClientRect() : { left: 0, top: 0 };
  if (SCENE.pos[drag.id]) {
    // pin where dropped; a pinned mission stands alone, a pinned job is
    // released from its parent offset
    SCENE.pins[drag.id] = {
      x: Math.max(46, Math.min(SCENE.W - 46, ev.clientX - rect.left)),
      y: Math.max(40, Math.min(SCENE.H - 40, ev.clientY - rect.top)),
    };
    placeOverlays();
  }
}

function selectMission(id) {
  SCENE.selectedMission = id;
  SCENE.selectedJob = null;
  $("mission-overlay").hidden = !id;
  $("job-overlay").hidden = true;
  if (id) {
    selectedMission = SCENE.missions.find((m) => m.id === id) || null;
    if (selectedMission) loadMissionDetail(id).catch((e) => toast(t("err.prefix") + e.message));
  } else {
    selectedMission = null;
  }
  layoutScene();
}

// ---- fiber hover tooltips: hit-test the strands, show state + executor
function distToPolyline(pts, x, y) {
  let best = Infinity;
  for (let i = 0; i + 3 < pts.length; i += 2) {
    const x1 = pts[i], y1 = pts[i + 1], x2 = pts[i + 2], y2 = pts[i + 3];
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    let tt = len2 ? ((x - x1) * dx + (y - y1) * dy) / len2 : 0;
    tt = Math.max(0, Math.min(1, tt));
    const d = Math.hypot(x - (x1 + tt * dx), y - (y1 + tt * dy));
    if (d < best) best = d;
  }
  return best;
}

function fiberAtPoint(x, y) {
  // reversed: job strands are drawn last (on top) and win overlaps
  for (let fi = SCENE.fibers.length - 1; fi >= 0; fi--) {
    const f = SCENE.fibers[fi];
    if (dimNode(f.to)) continue;
    for (const s of f.strands) {
      if (distToPolyline(s, x, y) <= 9) return f;
    }
  }
  return null;
}

function fiberTipHide() {
  const tip = $("fiber-tip");
  if (tip) tip.hidden = true;
}

function fiberTipShow(f, clientX, clientY) {
  const tip = $("fiber-tip");
  if (!tip) return;
  const color = sceneColor(f.state);
  const isJob = typeof f.to === "string" && f.to.startsWith("job:");
  tip.textContent = "";
  const head = document.createElement("div");
  head.className = "ft-head";
  const dot = document.createElement("i");
  dot.style.background = color;
  dot.style.boxShadow = "0 0 8px " + color;
  const b = document.createElement("b");
  head.appendChild(dot); head.appendChild(b);
  tip.appendChild(head);
  if (isJob) {
    const j = (SCENE.jobsByMission[SCENE.selectedMission] || [])
      .find((x) => "job:" + x.id === f.to);
    if (!j) { fiberTipHide(); return; }
    b.textContent = j.title || j.id;
    const rows = [
      t("tip.state") + ": " + stateLabel(j.state),
      t("tip.executor") + ": " + (j.executor || "—"),
    ];
    rows.forEach((r) => {
      const el = document.createElement("div");
      el.className = "ft-row";
      el.textContent = r;
      tip.appendChild(el);
    });
  } else {
    const m = SCENE.missions.find((x) => x.id === f.to);
    b.textContent = m ? (m.title || m.id) : f.to;
    const jobs = SCENE.jobsByMission[f.to] || [];
    const rows = [
      t("tip.state") + ": " + stateLabel(f.state),
      jobs.length + " " + t("graph.jobs"),
    ];
    rows.forEach((r) => {
      const el = document.createElement("div");
      el.className = "ft-row";
      el.textContent = r;
      tip.appendChild(el);
    });
  }
  const wrap = $("scene-wrap");
  const rect = wrap ? wrap.getBoundingClientRect() : { left: 0, top: 0 };
  const px = clientX - rect.left, py = clientY - rect.top;
  tip.style.left = Math.min(Math.max(8, px + 14), Math.max(8, SCENE.W - 240)) + "px";
  tip.style.top = Math.max(8, py - 12) + "px";
  tip.hidden = false;
}

function scenePointerMove(ev) {
  if (SCENE.drag) { SCENE.hover = null; fiberTipHide(); return; }
  const wrap = $("scene-wrap");
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();
  const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
  const f = fiberAtPoint(x, y);
  SCENE.hover = f ? { id: f.id } : null;
  if (f) fiberTipShow(f, ev.clientX, ev.clientY);
  else fiberTipHide();
}

function scenePointerLeave() {
  SCENE.hover = null;
  fiberTipHide();
}

function resizeScene() {
  const wrap = $("scene-wrap");
  const canvas = $("scene-canvas");
  if (!wrap || !canvas) return;
  const rect = wrap.getBoundingClientRect();
  SCENE.W = Math.max(320, rect.width);
  SCENE.H = Math.max(380, rect.height);
  SCENE.dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = SCENE.W * SCENE.dpr;
  canvas.height = SCENE.H * SCENE.dpr;
  SCENE.backdrop = paintBackdrop(SCENE.W, SCENE.H, SCENE.dpr);
  layoutScene();
}

function startScene() {
  const canvas = $("scene-canvas");
  if (!canvas || !canvas.getContext) return;
  canvas.addEventListener("pointermove", scenePointerMove);
  canvas.addEventListener("pointerleave", scenePointerLeave);
  SCENE.last = performance.now();
  resizeScene();
  cancelAnimationFrame(SCENE.raf);
  SCENE.raf = requestAnimationFrame(drawScene);
}

function rebuildScene() {
  SCENE.missions = (SCENE.missions || []).slice();
  layoutScene();
  renderSceneFoot();
  maybeShowSceneHint();
}

// one-time drag hint: shown on the first run that has missions on the fiber
function maybeShowSceneHint() {
  const el = $("scene-hint");
  if (!el) return;
  if (!SCENE.missions.length || readStore("agent_os_drag_hint_done") === "1") {
    el.hidden = true;
    return;
  }
  el.hidden = false;
  applyI18n(el);
}

function hideSceneHint() {
  const el = $("scene-hint");
  if (!el) return;
  el.hidden = true;
  writeStore("agent_os_drag_hint_done", "1");
}

$("hint-dismiss").addEventListener("click", hideSceneHint);

function renderSceneFoot() {
  const counts = { running: 0, awaiting: 0, complete: 0, offline: 0 };
  SCENE.missions.forEach((m) => { counts[missionNodeState(m)]++; });
  const el = $("scene-counts");
  el.textContent = "";
  Object.entries(counts).forEach(([k, v]) => {
    const dot = document.createElement("i");
    dot.style.cssText = "width:10px;height:10px;border-radius:999px;background:" + sceneColor(k === "running" ? "active" : k === "awaiting" ? "awaiting_approval" : k === "complete" ? "completed" : "offline")
      + ";box-shadow:0 0 8px " + sceneColor(k === "running" ? "active" : k);
    const span = document.createElement("span");
    span.textContent = String(v);
    el.appendChild(dot); el.appendChild(span);
  });
  const legend = $("scene-legend");
  legend.textContent = "";
  [["active", "legend.active"], ["awaiting_approval", "legend.awaiting"],
   ["completed", "legend.complete"], ["offline", "legend.offline"]].forEach(([ck, lk]) => {
    const wrap = document.createElement("span");
    const i = document.createElement("i");
    i.style.background = sceneColor(ck);
    i.style.boxShadow = "0 0 8px " + sceneColor(ck);
    wrap.appendChild(i);
    wrap.appendChild(document.createTextNode(t(lk)));
    legend.appendChild(wrap);
  });
}
