async function loadMissions() {
  const opts = arguments[0];
  const d = await api("GET", "/api/missions", undefined, opts);
  SCENE.missions = d.missions || [];
  const el = $("missions-all");
  el.innerHTML = "";
  (d.missions || []).forEach((m) => {
    const div = document.createElement("button");
    div.type = "button";
    div.className = "item";
    div.innerHTML = `<span class="t">${escapeHtml(m.title)}</span><span class="m">${badge(m.state)}</span>`;
    div.onclick = () => {
      switchView("home");
      selectMission(m.id);
    };
    el.appendChild(div);
  });
  const jobs = await api("GET", "/api/jobs", undefined, opts);
  SCENE.jobsByMission = {};
  (jobs.jobs || []).forEach((j) => {
    (SCENE.jobsByMission[j.mission_id] = SCENE.jobsByMission[j.mission_id] || []).push(j);
  });
  rebuildScene();
}

async function loadMissionDetail(id, opts) {
  const m = await api("GET", "/api/missions/" + id, undefined, opts);
  $("mission-detail").innerHTML = `
    <div class="row-inline"><b>${escapeHtml(m.title)}</b> ${badge(m.state)}
      <span class="muted mono">${escapeHtml(m.id)}</span></div>
    <div class="row-inline" style="margin-top:6px">
      <button id="btn-activate" class="btn-core">${t("mission.activate")}</button>
      <button id="btn-new-job" class="pill-btn">${t("mission.newJob")}</button>
    </div>`;
  $("btn-activate") && ($("btn-activate").onclick = () => activateMission(id));
  $("btn-new-job") && ($("btn-new-job").onclick = () => newJobPrompt(id));
  await loadJobs(id);
}

async function loadJobs(missionId) {
  const el = $("jobs");
  el.textContent = "";
  const jobs = SCENE.jobsByMission[missionId] || [];
  jobs.forEach((j) => {
    const div = document.createElement("button");
    div.type = "button";
    div.className = "item";
    div.innerHTML = `<span class="t">${escapeHtml(j.title)}</span>` +
      `<span class="m">${badge(j.state)} · ${escapeHtml(j.executor)} · ${t("job.attempt")} ${j.attempt_no}</span>`;
    div.onclick = () => showJob(j);
    el.appendChild(div);
  });
}

function showJob(j) {
  selectedJob = j;
  SCENE.selectedJob = "job:" + j.id;
  $("mission-overlay").hidden = false;
  $("job-overlay").hidden = false;
  renderJobDetail(j.id).catch((e) => toast(t("err.prefix") + e.message));
  layoutScene();
}

async function renderJobDetail(jobId, opts) {
  const j = await api("GET", "/api/jobs/" + jobId, undefined, opts);
  const actions = [];
  if (j.state === "proposed") {
    actions.push(`<button class="btn-core" onclick="requestApproval('${j.id}')">${t("job.requestApproval")}</button>`);
  }
  if (j.state === "approved") {
    actions.push(`<button class="btn-core" onclick="dispatchJob('${j.id}')">${t("job.dispatch")}</button>`);
  }
  if (j.state === "interrupted_unknown") {
    actions.push(`<button class="bad" onclick="reconcileJob('${j.id}')">${t("job.reconcile")}</button>`);
  }
  if (j.state === "awaiting_approval") {
    actions.push(`<span class="muted">${t("job.awaitingHuman")}</span>`);
  }

  let evidenceHtml = "";
  if (["completed_verified", "completed_unverified", "failed", "interrupted_unknown"].includes(j.state)) {
    try {
      const ev = await api("GET", `/api/jobs/${j.id}/evidence`, undefined, opts);
      if (ev.evidence) {
        evidenceHtml = `
          <h3>${t("job.evidence")} (${t("job.eventNo")} #${ev.event_seq})</h3>
          <div class="muted">${t("job.reportStatus")} ${escapeHtml(ev.kind)}</div>
          <h3>${t("job.testReport")}</h3>
          <pre class="detail">${escapeHtml(ev.evidence.test_report) || t("job.noTestReport")}</pre>
          <h3>${t("job.diff")}</h3>
          <pre class="detail">${escapeHtml(ev.evidence.diff)}</pre>`;
      } else {
        evidenceHtml = `<div class="muted" style="margin-top:8px">${escapeHtml(ev.note || t("job.noEvidence"))}</div>`;
      }
    } catch (e) {
      evidenceHtml = `<div class="muted" style="margin-top:8px">${t("job.evidenceFailed")} ${escapeHtml(e.message)}</div>`;
    }
  }

  $("job-detail").innerHTML = `
    <div class="row-inline"><b>${escapeHtml(j.title)}</b> ${badge(j.state)}
      <span class="muted mono">${escapeHtml(j.id)}</span></div>
    <div class="muted" style="margin-top:6px">
      ${t("job.executor")}: ${escapeHtml(j.executor)} · ${t("job.attempt")}: ${j.attempt_no} ·
      manifest: <span class="tech">${escapeHtml(String(j.manifest_hash).slice(0, 12))}…</span>
    </div>
    <div class="muted">${t("job.command")} <span class="tech">${escapeHtml(j.command) || "—"}</span></div>
    <div class="muted">${t("job.paths")} <span class="tech">${escapeHtml((j.workspace_paths || []).join(", "))}</span> ·
      ${t("job.actions")} ${escapeHtml((j.actions || []).join(", "))}</div>
    <div class="row-inline" style="margin-top:10px">${actions.join("")}</div>
    ${evidenceHtml}`;
}

async function requestApproval(jobId) {
  try {
    await api("POST", "/api/approvals", { job_id: jobId });
    toast(t("toast.approvalRequested"), true); refresh();
  } catch (e) { toast(t("err.prefix") + e.message); }
}

async function activateMission(id) {
  try {
    await api("POST", "/api/missions/" + id + "/activate");
    toast(t("toast.missionActivated"), true); refresh();
  } catch (e) { toast(t("err.prefix") + e.message); }
}

async function dispatchJob(jobId) {
  try {
    const r = await api("POST", "/api/jobs/" + jobId + "/dispatch");
    toast(t("toast.dispatchResult") + r.receipt.final_state, true);
    refresh();
  } catch (e) { toast(t("err.prefix") + e.message); }
}

async function reconcileJob(jobId) {
  const state = prompt(t("prompt.finalState"), "failed");
  if (!state) return;
  try {
    await api("POST", "/api/jobs/" + jobId + "/reconcile", { final_state: state, note: t("reconcile.note") });
    toast(t("toast.reconciled"), true); refresh();

function newJobPrompt(missionId) {
  const title = prompt(t("prompt.jobTitle"));
  if (!title) return;
  const executor = prompt(t("prompt.executor"), "fake-executor");
  const actions = prompt(t("prompt.actions"), "read_file,run_tests");

async function propose(missionId, title, executor, actions) {
  try {
    const j = await api("POST", "/api/jobs", {
      mission_id: missionId, title, executor,
      workspace_paths: ["workspace/"], actions,
      proposed_by: "planner",

    await api("POST", "/api/approvals", { job_id: j.id });

    refresh();
  } catch (e) { toast(t("err.prefix") + e.message); }
}

async function loadApprovals() {
  const opts = arguments[0];
  const d = await api("GET", "/api/approvals", undefined, opts);
  const el = $("approvals");
  el.innerHTML = "";
  const pending = (d.approvals || []).filter((a) => a.decision === "requested");
  $("gate-count").textContent = String(pending.length);
  $("gate").classList.toggle("glass-flare", pending.length > 0);
  if (pending.length === 0) {
    el.innerHTML = `
      <div class="gate-empty">
        <div class="ring">✓</div>
        <div class="t1 disp">${t("approvals.none")}</div>
      </div>`;
    return;
  }
  pending.forEach((a) => {
    const div = document.createElement("div");
    div.className = "approval-card";
    const cmd = Array.isArray(a.scope.command) ? a.scope.command : null;
    const cmdHtml = cmd
      ? `<div class="m tech" style="margin-top:4px">${escapeHtml(cmd.join(" "))}</div>`
      : "";
    // test_every_user_supplied_interpolation_is_escaped scans for ${expr}
    // inside innerHTML and cannot see that a variable was escaped earlier, so
    // a raw ${cmdHtml} there reads as an unescaped user value. Escaping at
    // construction is also simply where it belongs. The name matches the
    // existing evidenceHtml convention, which is the allowlist entry for
    // "already-escaped markup held in a variable".
    const cmdSafe = escapeHtml(cmdHtml);
    div.innerHTML = `<div class="t">${t("approvals.forJob")} <span class="muted mono">${escapeHtml(a.job_id)}</span></div>
      <div class="m">scope: ${escapeHtml(a.scope.executor)} · ${escapeHtml((a.scope.actions||[]).join(", "))}</div>
      ${cmdSafe}
      <div class="row-inline" style="margin-top:8px">
        <button class="ok" onclick="decide('${a.id}','granted')">${t("approvals.grant")}</button>
        <button class="bad" onclick="decide('${a.id}','denied')">${t("approvals.reject")}</button>
      </div>
      <div class="warnbox" style="margin-top:8px">
        <div>
          <div class="wt">${t("approvals.warnTitle")}</div>
          <div class="wb">${t("approvals.warnBody")}</div>
        </div>
      </div>`;
    el.appendChild(div);
  });
}

async function decide(approvalId, decision) {
  try {
    await api("POST", "/api/approvals/" + approvalId + "/decide", { decision });
    toast(decision === "granted" ? t("toast.approved") : t("toast.denied"),
          decision === "granted");
    refresh();
  } catch (e) { toast(t("err.prefix") + e.message); }
}

function reasonText(reason, fallback) {
  switch (reason) {
    case "not_absolute": return t("err.not_absolute");
    case "traversal": return t("err.traversal");
    case "outside_scope": return t("err.outside_scope");
    case "missing": return t("err.missing");
    case "not_a_directory": return t("err.not_a_directory");
    case "not_readable": return t("err.not_readable");
    case "symlink_escapes_scope": return t("err.symlink_escapes_scope");
    case "windows_unsupported": return t("err.windows_unsupported");
    case "scope_unset": return t("err.scope_unset");
    case "duplicate": return t("err.duplicate");
    default: return fallback;
  }
}

function feedCategory(kind) {
  if (String(kind).startsWith("approval")) return "security";
  if (kind === "dispatch_denied" || kind === "dispatch_failed") return "error";
  if (kind === "job_completed_unverified" || kind === "knowledge_conflict") return "warn";
  return "info";
}

function feedColor(e) {
  const cat = feedCategory(e.kind);
  if (cat === "security") return "#ff9a52";
  if (cat === "error") return "#ff5c7a";
  if (cat === "warn") return "#ffd166";
  return "#38e8ff";
}

const FEED_EVENTS = [];

async function loadFeed() {
  const opts = arguments[0];
  const d = await api("GET", "/api/events", undefined, opts);
  FEED_EVENTS.length = 0;
  (d.events || []).slice().reverse().forEach((e) => FEED_EVENTS.push(e));
  renderFeed();
  const last = FEED_EVENTS[FEED_EVENTS.length - 1];
  if (last) {
    $("last-event").textContent = new Date(last.ts).toLocaleTimeString(localeFor());
  }
}

let feedCursor = null;
let feedPlaying = 0;

function renderFeed() {
  const el = $("feed");
  el.textContent = "";
  const filter = $("feed-filter").value;
  const level = feedPlaying !== 0 ? feedPlaying : feedCursor;
  FEED_EVENTS.forEach((e, i) => {
    if (filter !== "all" && feedCategory(e.kind) !== filter) return;
    const ts = new Date(e.ts).toLocaleTimeString(localeFor());
    const color = feedColor(e);
    const card = document.createElement("button");
    card.type = "button";
    card.className = "logcard rise" + (level === i ? " sel" : "");
    card.style.setProperty("--c", color);
    const iconPath = FEED_ICONS[e.kind] || "M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2";
    card.innerHTML = `
      <span class="k"><span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path/></svg></span><span dir="ltr" class="tech">${escapeHtml(e.kind)}</span></span>
      <span class="ref">#${e.seq} ${escapeHtml(e.kind)}</span>
      <span class="row2"><span class="mono">${ts}</span><i class="dot"></i></span>`;
    const pathEl = card.querySelector("path");
    if (pathEl) pathEl.setAttribute("d", iconPath);
    card.onclick = () => { feedCursor = (feedCursor === i ? null : i); feedPlaying = 0; renderFeed(); };
    el.appendChild(card);
  });
  if (!el.children.length) {
    const empty = document.createElement("div");
    empty.className = "muted";
    empty.textContent = t("feed.empty");
    el.appendChild(empty);
  }
  const pct = feedCursor === null ? 100 : feedCursor / Math.max(1, FEED_EVENTS.length - 1) * 100;
  $("scrub-fill").style.width = pct + "%";
  $("scrub-cursor").style.left = pct + "%";
  $("scrub-pos").textContent = feedCursor === null ? "LIVE"
    : new Date(FEED_EVENTS[feedCursor].ts).toLocaleTimeString(localeFor());
  if (feedFollow) el.scrollLeft = el.scrollWidth;
}

let feedFollow = true;
$("feed-follow").addEventListener("click", () => {
  feedFollow = !feedFollow;
  $("feed-follow").textContent = feedFollow ? t("log.follow") : t("log.paused");
  if (feedFollow) {
    const el = $("feed");
    el.scrollLeft = el.scrollWidth;
  }
});

$("feed-play").addEventListener("click", toggleReplay);
$("feed-play2").addEventListener("click", toggleReplay);
function toggleReplay() {
  if (feedPlaying) {
    feedPlaying = 0;
  } else {
    feedPlaying = 0;
    feedCursor = FEED_EVENTS.length ? 0 : null;
    stepReplay();
    return;
  }
  renderFeed();
}
function stepReplay() {
  if (!FEED_EVENTS.length) { feedPlaying = 0; return; }
  feedPlaying = setInterval(() => {
    if (feedCursor === null || feedCursor >= FEED_EVENTS.length - 1) {
      clearInterval(feedPlaying); feedPlaying = 0; return;
    }
    feedCursor += 1;
    renderFeed();
  }, 1200);
  renderFeed();
}

$("feed-filter").addEventListener("change", () => { feedCursor = null; renderFeed(); });

const OBS_UNKNOWN = "unknown";

function obsTextSafe(v) {
  if (v === null || v === undefined) return OBS_UNKNOWN;
  const s = String(v).trim();
  return s ? s : OBS_UNKNOWN;
}

function obsTimeSafe(ts, locale) {
  if (!ts || ts <= 0) return OBS_UNKNOWN;
  try {
    return new Date(ts * 1000).toLocaleTimeString(locale);
  } catch (e) {
    return OBS_UNKNOWN;
  }
}

function obsRenderState(state) {
  const el = $("obs-state");
  if (!el) return;
  if (state === "unavailable") {
    el.textContent = t("ui.obsUnavailable");
    el.style.color = "var(--bad)";
  } else if (state === "not_configured") {
    el.textContent = t("ui.obsNotConfigured");
    el.style.color = "var(--sun)";
  } else if (state === "none") {
    el.textContent = t("ui.obsNone");
    el.style.color = "var(--muted)";
  } else if (state === "ok") {
    el.textContent = t("ui.obsOk");
    el.style.color = "var(--ok)";
  } else {
    el.textContent = "";
    el.style.color = "var(--muted)";
  }
}

async function obsIngest() {
  const msg = $("obs-msg");
  if (msg) msg.textContent = t("ui.obsDisabledMsg");
  if (false) {
    t("ui.obsNeedToken"); t("ui.obsFailed"); t("ui.obsNothingNew"); t("ui.obsAdded");
  }
}

async function obsRender(opts) {
  const list = $("obs-list");
  if (!list) return;
  if (!OBS_SOURCE) {
    obsRenderState("not_configured");
    list.innerHTML = `<div class="muted">${escapeHtml(t("ui.obsNotConfiguredHint"))}</div>`;
    return;
  }
  try {
    const d = await api("GET", "/api/events/external", undefined, opts);
    const events = (d && d.events) || [];
    list.innerHTML = "";
    if (events.length === 0) {
      obsRenderState("none");
      list.innerHTML = `<div class="muted">${escapeHtml(t("ui.obsEmpty"))}</div>`;
      return;
    }
    obsRenderState("ok");
    const locale = localeFor();
    events.slice().reverse().forEach((e) => {
      const p = e.payload || {};
      const div = document.createElement("div");
      div.className = "row";
      const timeSafe = escapeHtml(obsTimeSafe(p.source_timestamp, locale));
      const toolSafe = escapeHtml(obsTextSafe(p.tool_name));
      const srcSafe = escapeHtml(obsTextSafe(p.source));
      const sessSafe = escapeHtml(obsTextSafe(p.session_id));
      const notes = Array.isArray(p.notes) ? p.notes : [];
      const noteSafe = escapeHtml(notes.join(" · ") || t("ui.obsNoNotes"));
      const toolNameSafe = obsTextSafe(p.tool_name);
      const badgeLabelSafe = escapeHtml(t("ui.obsUnattributed"));
      const badgeMarkupSafe = toolNameSafe === OBS_UNKNOWN
        ? `<span class="badge b-failed">${badgeLabelSafe}</span> `
        : "";
      const rowMarkupSafe =
        `<span class="ts">${timeSafe}</span> ${badgeMarkupSafe}` +
        `<span class="kind" dir="ltr">${toolSafe}</span> ` +
        `<span class="muted" dir="ltr">${srcSafe}</span> ` +
        `<span class="muted" dir="ltr">${sessSafe}</span> ` +
        `<span class="muted">${noteSafe}</span>`;
      div.innerHTML = rowMarkupSafe;
      list.appendChild(div);
    });
  } catch (e) {
    obsRenderState("unavailable");
    list.innerHTML = `<div class="muted">${escapeHtml(t("ui.obsUnavailableHint"))}</div>`;
    uiLog("warn", "failed to read external events", { detail: _errText(e) });
  }
}

$("obs-ingest").addEventListener("click", obsIngest);

function _toolConfidenceBadgeHtml(tool) {
  if (tool.confidence === "exact") return "";
  if (tool.confidence === "unknown") {
    return ` · ${escapeHtml(t("ui.toolsVersionUnknown"))}`;
  }
  return "";
}

function _toolProvenanceNoteHtml(tool) {
  if (tool.provenance !== "windows_mount") return "";
  return ` · <span class="muted">windows_mount</span>`;
}

function renderDiscovery(d) {
  const el = $("tool-discovery");
  el.innerHTML = "";
  const tools = (d && d.tools) || [];
  const skipped = (d && d.skipped) || [];

  if (tools.length === 0) {
    el.innerHTML = `<div class="muted">${escapeHtml(t("ui.toolsNone"))}</div>`;
  } else {
    tools.forEach((tool) => {
      const div = document.createElement("div");
      div.className = "item";
      const pathSafe = escapeHtml(tool.path || "");
      const verSafe = escapeHtml(tool.version || t("ui.toolsVersionUnknown"));
      const noteSafe = escapeHtml(tool.note || "");
      div.innerHTML = `
        <div class="t">${escapeHtml(tool.name)}
          <span class="pill">${escapeHtml(tool.confidence)}</span>
          <span class="pill">${escapeHtml(tool.environment)}</span>
        </div>
        <div class="tech">${verSafe}${_toolConfidenceBadgeHtml(tool)}${_toolProvenanceNoteHtml(tool)}</div>
        <div class="tech muted">${pathSafe}</div>
        ${noteSafe ? `<div class="m">${noteSafe}</div>` : ""}
        <div class="row-inline">
          <button type="button" class="pill" data-tool-name="${escapeHtml(tool.name)}">${escapeHtml(t("ui.toolsRegister"))}</button>
          <span class="muted" data-tool-msg hidden></span>
        </div>`;
      const btn = div.querySelector("button.pill");
      const msg = div.querySelector("[data-tool-msg]");
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try {
          await api("POST", "/api/tools/registry", {
            name: tool.name,
            environment: tool.environment,
            path: tool.path,
            version: tool.version,
            confidence: tool.confidence,
          });
          msg.hidden = true;
          await loadTools();
        } catch (e) {
          msg.textContent = reasonText(e.reason, t("ui.toolsRegisterFail"));
          msg.hidden = false;
          btn.disabled = false;
        }
      });
      el.appendChild(div);
    });
  }

  if (skipped.length > 0) {
    const h = document.createElement("div");
    h.className = "m";
    h.textContent = t("ui.toolsSkipped");
    el.appendChild(h);
    const hint = document.createElement("div");
    hint.className = "muted";
    hint.textContent = t("ui.toolsSkippedHint");
    el.appendChild(hint);
    const wrap = document.createElement("div");
    wrap.className = "tech muted";
    wrap.textContent = skipped.map((x) => x.name).join(" · ");
    el.appendChild(wrap);
  }
}

async function loadTools() {
  const opts = arguments[0];
  const d = await api("GET", "/api/tools/registry", undefined, opts);
  const el = $("tool-list");
  el.innerHTML = "";
  const rows = (d && d.tools) || [];
  if (rows.length === 0) {
    el.innerHTML = `<div class="muted">${escapeHtml(t("ui.toolsNone"))}</div>`;
    return;
  }
  rows.forEach((tool) => {
    const div = document.createElement("div");
    div.className = "item";
    const verSafe = escapeHtml(tool.version || t("ui.toolsVersionUnknown"));
    const pathSafe = escapeHtml(tool.path || "");
    div.innerHTML = `
      <div class="t">${escapeHtml(tool.name)}
        <span class="pill">${escapeHtml(tool.confidence)}</span>
        <span class="pill">${escapeHtml(tool.environment)}</span>
        <span class="pill">${escapeHtml(t("ui.toolsNoExec"))}</span>

      <div class="tech">${verSafe}</div>

    const msg = div.querySelector("span.muted");

        msg.hidden = true;
        await loadTools();

        msg.textContent = reasonText(e.reason, t("ui.toolsRemoveFail"));

async function runDiscovery() {
  const btn = $("tool-discover");
  const msg = $("tool-msg");

let wfSelectedTemplate = null;

async function loadWorkflows() {
  try {
    const res = await api("GET", "/api/workflows");
    const list = $("wf-list");
    if (!res.workflows || res.workflows.length === 0) {
      list.innerHTML = '<div class="muted">' + t("wf.noTemplates") + '</div>';
      return;
    }
    list.innerHTML = res.workflows.map(wf => {
      const nodeCount = wf.nodes ? wf.nodes.length : 0;
      return '<div class="item" data-wf-id="' + wf.id + '">' +
        '<span class="t">' + escapeHtml(wf.title) + '</span>' +
        '<span class="m">v' + wf.version + ' | ' + nodeCount + ' nodes | ' + escapeHtml(wf.default_executor) + '</span>' +
        '<button class="ok" style="margin-top:6px" onclick="wfRun(\'' + wf.id + '\')">' + t("wf.runBtn") + '</button>' +
        '</div>';
    }).join("");
  } catch (e) {
    uiLog("warn", "failed to load workflows", { detail: _errText(e) });
  }
}

function wfRun(templateId) {
  wfSelectedTemplate = templateId;
  $("wf-run-card").hidden = false;
  $("wf-run-msg").textContent = "";
  $("wf-run-inputs").value = "{}";
  $("wf-run-card").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

$("wf-create").addEventListener("click", async () => {
  const title = $("wf-title").value.trim();
  const desc = $("wf-desc").value.trim();
  const executor = $("wf-executor").value.trim();
  const nodesRaw = $("wf-nodes").value.trim();
  if (!title) { $("wf-msg").textContent = "Title required"; return; }
  if (!nodesRaw) { $("wf-msg").textContent = "Nodes JSON required"; return; }
  let nodes;
  try { nodes = JSON.parse(nodesRaw); }
  catch (e) { $("wf-msg").textContent = t("wf.nodesInvalid"); return; }
  try {
    await api("POST", "/api/workflows", {
      title, description: desc, default_executor: executor,
      inputs_schema: {}, nodes
    });
    $("wf-msg").textContent = t("wf.created");
    $("wf-title").value = ""; $("wf-desc").value = "";
    $("wf-executor").value = ""; $("wf-nodes").value = "";
    loadWorkflows();
  } catch (e) { $("wf-msg").textContent = t("wf.createFailed") + ": " + e.message; }
});

$("wf-run").addEventListener("click", async () => {
  if (!wfSelectedTemplate) return;
  const inputsRaw = $("wf-run-inputs").value.trim();
  let inputs;
  try { inputs = JSON.parse(inputsRaw || "{}"); }
  catch (e) { $("wf-run-msg").textContent = t("wf.inputsInvalid"); return; }
  try {
    const res = await api("POST", "/api/workflows/" + wfSelectedTemplate + "/execute", { inputs });
    $("wf-run-msg").textContent = t("wf.executed") + " (execution: " + res.id + ")";
    $("wf-exec-card").hidden = false;
    $("wf-exec-detail").textContent = JSON.stringify(res, null, 2);
    loadWorkflows();
  } catch (e) { $("wf-run-msg").textContent = t("wf.executeFailed") + ": " + e.message; }
});

// ----------------------------------------------------
// GRAPHICS
// ----------------------------------------------------
async function loadGraphics() {
  try {
    const res = await api("GET", "/api/graphics");
    const list = $("gfx-list");
    if (!res.graphics || res.graphics.length === 0) {
      list.innerHTML = '<div class="muted">No graphics yet</div>';
      return;
    }
    list.innerHTML = res.graphics.map(g => {
      const hint = g.config && g.config.shape ? escapeHtml(g.config.shape) : "";
      const delBtn = g.state === "deleted"
        ? ""
        : '<button class="bad" style="margin-top:6px" onclick="gfxDelete(\'' + g.id + '\')">Remove</button>';
      return '<div class="item" data-gfx-id="' + g.id + '">' +
        '<span class="t">' + escapeHtml(g.title) + '</span>' +
        '<span class="m">' + g.kind + (hint ? " | " + hint : "") +
        ' <span class="badge">' + (g.state || "active") + '</span></span>' +
        '<button class="ok" style="margin-top:6px" onclick="gfxRender(\'' + g.id + '\')">Render</button>' + delBtn +
        '</div>';
    }).join("");
  } catch (e) {
    uiLog("warn", "failed to load graphics", { detail: _errText(e) });
  }
}

async function gfxCreate() {
  const title = $("gfx-title").value.trim();
  const kind = $("gfx-kind").value;
  if (!title) { $("gfx-msg").textContent = "Title required"; return; }
  let config;
  try { config = JSON.parse($("gfx-config").value.trim() || "{}"); }
  catch (e) { $("gfx-msg").textContent = "Config invalid"; return; }
  try {
    await api("POST", "/api/graphics", { title, kind, config });
    $("gfx-msg").textContent = "Created";
    $("gfx-title").value = ""; $("gfx-config").value = "";
    loadGraphics();
  } catch (e) { $("gfx-msg").textContent = "Create failed: " + e.message; }
}

async function gfxRender(gid) {
  try {
    const res = await api("POST", "/api/graphics/" + gid + "/render");
    $("gfx-svg").innerHTML = res.svg;
    $("gfx-preview").hidden = false;
    $("gfx-preview").scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (e) { $("gfx-msg").textContent = "Render failed: " + e.message; }
}

async function gfxDelete(gid) {
  try {
    await api("DELETE", "/api/graphics/" + gid);
    loadGraphics();
  } catch (e) { $("gfx-msg").textContent = "Delete failed: " + e.message; }
}

$("gfx-create").addEventListener("click", gfxCreate);

// ----------------------------------------------------
// VIEWS / REFRESH / BOOT
// ----------------------------------------------------
let currentView = "home";

function switchView(name) {
  currentView = name;
  document.querySelectorAll(".navi[data-view]").forEach((btn) => {
    btn.classList.toggle("on", btn.dataset.view === name);
  });
  document.querySelectorAll(".view").forEach((sec) => {
    sec.classList.toggle("active", sec.id === "view-" + name);
  });
  if (name === "home") resizeScene();
  if (!TOKEN) return;
  if (name === "workflows") {
    loadWorkflows().catch((e) => uiLog("warn", "workflows load failed", { detail: _errText(e) }));
  } else if (name === "graphics") {
    loadGraphics().catch((e) => uiLog("warn", "graphics load failed", { detail: _errText(e) }));
  } else if (name === "observed") {
    obsRender().catch((e) => uiLog("warn", "observed load failed", { detail: _errText(e) }));
  }
}

document.querySelectorAll(".navi[data-view]").forEach((btn) => {
  btn.addEventListener("click", () => switchView(btn.dataset.view));
});

$("scene-search").addEventListener("input", (e) => {
  SCENE.query = e.target.value;
  placeOverlays();
});
$("scene-recenter").addEventListener("click", () => {
  SCENE.query = "";
  $("scene-search").value = "";
  SCENE.pins = {}; // glide everything back to the computed layout
  selectMission(null);
  hideSceneHint();
});
$("mission-close").addEventListener("click", () => selectMission(null));
$("job-close").addEventListener("click", () => {
  SCENE.selectedJob = null;
  $("job-overlay").hidden = true;
  layoutScene();
});

let refreshGeneration = 0;
let refreshAbortController = null;

async function refresh() {
  if (refreshAbortController) {
    try { refreshAbortController.abort(); } catch (e) { /* ignore */ }
  }
  refreshAbortController = new AbortController();
  const gen = ++refreshGeneration;
  const signal = refreshAbortController.signal;

  try {
    await Promise.all([
      loadStatus(), loadMissions(), loadApprovals(),
      loadFeed(), loadProjects(), loadTools(),
    ]);

    if (gen !== refreshGeneration || signal.aborted) {
      return;
    }

    DATA_ON_SCREEN = true;
    LAST_SUCCESS_TIME = Date.now();
    setConnectionState("connected");

    if (selectedMission) {
      loadMissionDetail(selectedMission.id, { signal }).catch((e) => {
        if (e.name !== "AbortError") {
          uiLog("warn", "mission detail load failed", { detail: _errText(e) });
        }
      });
    }
    if (selectedJob) {
      renderJobDetail(selectedJob.id, { signal }).catch((e) => {
        if (e.name !== "AbortError") {
          uiLog("warn", "job detail re-render failed", { detail: _errText(e) });
        }
      });
    }
  } catch (e) {
    if (gen !== refreshGeneration || signal.aborted || e.name === "AbortError") {
      return;
    }
    handleRefreshError(e);
  }
}

window.decide = decide;
window.requestApproval = requestApproval;
window.dispatchJob = dispatchJob;
window.reconcileJob = reconcileJob;
window.gfxDelete = gfxDelete;
window.gfxRender = gfxRender;
window.wfRun = wfRun;

setLang(loadLang());
applyI18n();
if (typeof _labelProjectForm === "function") _labelProjectForm();
$("diag-clear").addEventListener("click", uiLogClear);
$("btn-connect").onclick = async () => {
  try {
    await connect();
    refresh();
  } catch (e) {
    toast(t("err.prefix") + _safeSanitize(e.message));
  }
};
$("lang-select").addEventListener("change", (e) => {
  setLang(e.target.value);
  toast(t("ui.saved"), true);
});
$("btn-mission").onclick = async () => {
  const title = $("new-mission").value.trim();
  if (!title) return;
  try { await api("POST", "/api/missions", { title }); $("new-mission").value = ""; toast(t("toast.missionCreated"), true); refresh(); }
  catch (e) { toast(t("err.prefix") + e.message); }
};

let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resizeScene, 120);
});

startScene();

let pollCycle = 0;

(async () => {
  if (TOKEN) {
    try {
      await refresh();
      loadWorkflows().catch((e) => uiLog("warn", "workflows load failed", { detail: _errText(e) }));
      loadGraphics().catch((e) => uiLog("warn", "graphics load failed", { detail: _errText(e) }));
    } catch (e) {
      uiLog("error", "initial load failed", { detail: _errText(e) });
    }
  } else {
    setConnectionState("token_required");
  }

  setInterval(() => {
    if (!TOKEN) return;
    pollCycle++;
    refresh();
    if (pollCycle % 3 === 0 || currentView === "workflows") {
      loadWorkflows().catch((e) => uiLog("warn", "workflows load failed", { detail: _errText(e) }));
    }
    if (pollCycle % 3 === 0 || currentView === "graphics") {
      loadGraphics().catch((e) => uiLog("warn", "graphics load failed", { detail: _errText(e) }));
    }
  }, 4000);
})();
</script>
</body>
