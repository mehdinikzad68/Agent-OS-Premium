<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent OS — Mission Control</title>
<style>
  :root {
    --bg: #0f1419; --panel: #171e26; --panel2: #1d2630; --border: #2a3542;
    --text: #e6edf3; --muted: #8b98a5; --accent: #4ea1ff; --ok: #2ea043;
    --warn: #d29922; --bad: #f85149; --info: #a371f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .spacer { flex: 1; }
  input, button, select, textarea {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  button { cursor: pointer; }
  .langsel { color: var(--muted); font-size: 12px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #06121f; border-color: var(--accent); font-weight: 600; }
  button.ok { background: var(--ok); color: #04120a; border-color: var(--ok); }
  button.bad { background: var(--bad); color: #1c0605; border-color: var(--bad); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 14px; padding: 14px 16px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { padding: 8px 10px; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  .item:hover { border-color: var(--accent); }
  /* .item is now a real <button> so the keyboard can reach it */
  button.item { text-align: start; width: 100%; font: inherit; color: inherit;
    display: block; cursor: pointer; }
  .item .t { display: block; font-weight: 600; }
  .item .m { display: block; color: var(--muted); font-size: 12px; }
  /* A keyboard user must be able to see where they are. */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .b-draft { background: #30363d; }
  .b-active { background: #0d419d33; color: var(--accent); }
  .b-proposed { background: #30363d; color: var(--muted); }
  .b-awaiting_approval { background: #9e6a0333; color: var(--warn); }
  .b-approved { background: #0d419d33; color: var(--accent); }
  .b-running { background: #0d419d33; color: var(--accent); }
  .b-dispatched { background: #0d419d33; color: var(--accent); }
  .b-completed_verified { background: #2ea04333; color: var(--ok); }
  .b-completed_unverified { background: #d2992233; color: var(--warn); }
  .b-failed { background: #f8514933; color: var(--bad); }
  .b-interrupted_unknown { background: #a371f733; color: var(--info); }
  .b-closed { background: #30363d; }
  .feed { max-height: 420px; overflow-y: auto; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .feed .row { padding: 4px 6px; border-bottom: 1px solid var(--border); }
  .feed .seq { color: var(--muted); }
  .feed .kind { color: var(--accent); }
  .feed .ts { color: var(--muted); float: left; }
  pre.detail { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: var(--panel2); padding: 10px; border-radius: 6px; }
  .row-inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .pill { display:inline-block; padding: 2px 8px; border-radius: 10px; background: var(--panel2); border:1px solid var(--border); font-size: 12px; }
  #toast { position: fixed; bottom: 16px; left: 16px; background: var(--panel); border:1px solid var(--border); padding: 10px 14px; border-radius: 8px; display:none; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); }
</style>
</head>

<header>
  <h1>🛰️ Agent OS — Mission Control</h1>

    <option value="fa">فارسی</option>

</header>

    </div>
  </aside>

  <main>
    <div class="card">
      <h2 data-i18n="mission.detail"></h2>
      <div id="mission-detail" class="muted" data-i18n="mission.selectOne"></div>
      <div id="jobs" class="list" style="margin-top:10px"></div>
    </div>

    <div class="card" id="job-card" style="margin-top:12px; display:none">

    </div>

    <div class="card" style="margin-top:12px">
      <h2 data-i18n="feed.title"></h2>

      <pre id="diag" class="feed" style="margin-top:8px">—</pre>
      <button id="diag-clear" type="button" data-i18n="diag.clear"></button>
    </div>

        </div>

const DEFAULT_LANG = "en"; // product default; Persian is the selectable side
let LANG = DEFAULT_LANG;

function t(key) {
  const table = I18N[LANG] || I18N[DEFAULT_LANG];
  if (Object.prototype.hasOwnProperty.call(table, key)) return table[key];
  // Fallback chain: current language -> default language -> the key itself.
  const fallback = I18N[DEFAULT_LANG];
  if (Object.prototype.hasOwnProperty.call(fallback, key)) return fallback[key];
  return key;
}

// Set once the first successful refresh has put data on screen. Until then
// a language switch has nothing to re-render and must not make a request.
let DATA_ON_SCREEN = false;

// Sets the document language and writing direction for the active language.
// Persian is RTL; English is LTR. Technical blocks (feed/diff/code) keep their
// own LTR direction via CSS and are intentionally not affected here.
/* Fills every [data-i18n] text node and every [data-i18n-attr] attribute from
   the active catalog, so a language switch re-renders the static markup
   without a page reload. */
function applyI18n(root) {
  const scope = root || document;
  // The <title> element cannot carry data-i18n, so drive it from the catalog.
  document.title = t("app.title");
  scope.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    if (key) el.textContent = t(key);
  });
  scope.querySelectorAll("[data-i18n-attr]").forEach((el) => {
    const spec = el.getAttribute("data-i18n-attr") || "";
    spec.split("|").forEach((pair) => {
      const idx = pair.indexOf(":");
      if (idx < 0) return;
      const attr = pair.slice(0, idx).trim();
      const key = pair.slice(idx + 1).trim();
      if (attr && key) el.setAttribute(attr, t(key));
    });
  });
}

// localStorage throws in private mode and on a blocked-cookie profile, and
// a hand-edited value can be anything. One guarded accessor, so no read at
// module scope can take the page down before it can render anything, and a
// bad value falls back instead of breaking boot.
const LANG_STORE_KEY = "agent_os_lang";
const TOKEN_STORE_KEY = "agent_os_token";
function readStore(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function writeStore(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* storage disabled */ }
}
function loadLang() {
  const saved = readStore(LANG_STORE_KEY);
  if (saved && Object.prototype.hasOwnProperty.call(I18N, saved)) return saved;
  return DEFAULT_LANG;
}
function persistLang(lang) { writeStore(LANG_STORE_KEY, lang); }

// The selector is the only way a user changes the language, so it must
// never disagree with LANG - including on boot, when setLang runs from the
// stored value before this listener exists.
function syncLangSelect() {
  const el = $("lang-select");
  if (el && el.value !== LANG) el.value = LANG;
}

function setLang(lang) {
  LANG = Object.prototype.hasOwnProperty.call(I18N, lang) ? lang : DEFAULT_LANG;
  document.documentElement.lang = LANG === "fa" ? "fa" : "en";
  document.documentElement.dir = LANG === "fa" ? "rtl" : "ltr";
  persistLang(LANG);
  syncLangSelect();
  if (typeof applyI18n === "function") applyI18n();
  // Placeholders and the submit button carry no data-i18n, so applyI18n
  // cannot reach them; they are labelled by hand on every language change.
  if (typeof _labelProjectForm === "function") _labelProjectForm();
  // applyI18n only reaches [data-i18n] hooks. Every runtime panel is built
  // with innerHTML from JS, so those keep the previous language until the
  // data is re-rendered from the server.
  if (DATA_ON_SCREEN && typeof refresh === "function") {
    try { refresh(); } catch (e) { /* refresh reports its own failures */ }
  }
  return LANG;
}

function localeFor() {
  return LANG === "fa" ? "fa-IR" : "en-US";
}
// ==== end i18n scaffold ====

// ==== client-side diagnostics ====
// Errors that the page swallowed used to leave no trace at all: a failed
// refresh produced a silently empty screen. Every caught error now lands in
// one in-memory ring buffer and is rendered in the diagnostics panel. The
// buffer never leaves the browser: no network call, no secret in the DOM.
const UI_LOG_CAP = 200;
const UI_LOG = [];
let UI_LOG_DIRTY = false;

function _errText(e) {
  if (!e) return "unknown error";
  if (typeof e === "string") return e;
  return e.message || e.name || String(e);
}

function uiLog(level, message, fields) {
  const entry = {
    at: new Date().toISOString().slice(11, 23),
    level: level || "error",
    message: String(message),
  };
  if (fields) for (const k of Object.keys(fields)) entry[k] = fields[k];
  UI_LOG.push(entry);
  while (UI_LOG.length > UI_LOG_CAP) UI_LOG.shift();
  UI_LOG_DIRTY = true;
  // Also to the browser console, so devtools shows it without opening the panel.
  const line = `${entry.at} ${entry.level.toUpperCase()} ${entry.message}`;
  if (entry.level === "error") console.error(line, fields || "");
  else console.warn(line, fields || "");
  const el = $("diag");
  if (el) el.textContent = UI_LOG.length
    ? UI_LOG.map((r) => `${r.at} ${r.level.toUpperCase().padEnd(5)} ${r.message}`
        + (r.detail ? `  (${r.detail})` : "")).join("\n")
    : "—";
}

function uiLogClear() {
  UI_LOG.length = 0;
  UI_LOG_DIRTY = false;
  const el = $("diag");
  if (el) el.textContent = "—";
}
// ==== end client-side diagnostics ====

const $ = (id) => document.getElementById(id);
let TOKEN = readStore(TOKEN_STORE_KEY) || "";
let selectedMission = null;
let selectedJob = null;

$("token").value = TOKEN;

async function api(method, path, body) {
  const headers = {};
  if (TOKEN) headers["Authorization"] = "Bearer " + TOKEN;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const resp = await fetch(path, {
    method, headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const data = await resp.json().catch(() => {
    uiLog("warn", "response body was not JSON", { status: resp.status });
    return {};
  });
  if (!resp.ok) {
    const err = data.error || {};
    // reason is the server's own reason code. message may be prose that the
    // browser must never parse to decide what to translate.
    const e = new Error(err.message || ("HTTP " + resp.status));
    e.reason = err.reason || "";
    throw e;
  }
  return data;
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), 3000);
}

function badge(state) {
  return `<span class="badge b-${state}">${state}</span>`;
}

function escapeHtml(s) {
  return String(s === undefined || s === null ? "" : s)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
}

async function connect() {
  TOKEN = $("token").value.trim();
  writeStore(TOKEN_STORE_KEY, TOKEN);
  try {
    await api("GET", "/api/status");
    $("conn").textContent = t("conn.connected"); $("conn").style.color = "var(--ok)";
  } catch (e) {
    $("conn").textContent = t("err.prefix") + e.message; $("conn").style.color = "var(--bad)";
    throw e;
  }
}

async function loadStatus() {
  const s = await api("GET", "/api/status");
  $("status").innerHTML = `
    <div><b>${t("sys.version")}</b> ${s.version}</div>
    <div><b>${t("sys.executors")}</b> ${(s.executors||[]).join(", ") || t("sys.none")}</div>
    <div><b>${t("sys.db")}</b> <span class="muted">${s.db_path}</span></div>`;
}

async function loadMissions() {
  const d = await api("GET", "/api/missions");
  const el = $("missions");
  el.innerHTML = "";
  (d.missions || []).forEach((m) => {
    const div = document.createElement("button");
    div.type = "button";
    div.className = "item";
    div.innerHTML = `<span class="t">${m.title}</span><span class="m">${badge(m.state)}</span>`;
    div.onclick = () => { selectedMission = m; loadMissionDetail(m.id); };
    el.appendChild(div);
  });
}

async function loadMissionDetail(id) {
  const m = await api("GET", "/api/missions/" + id);
  $("mission-detail").innerHTML = `
    <div class="row-inline"><b>${m.title}</b> ${badge(m.state)}
      <span class="muted">${m.id}</span></div>
    <div class="row-inline" style="margin-top:6px">
      <button id="btn-activate" class="primary">${t("mission.activate")}</button>
      <button id="btn-new-job">${t("mission.newJob")}</button>
    </div>`;
  $("btn-activate") && ($("btn-activate").onclick = () => activateMission(id));
  $("btn-new-job") && ($("btn-new-job").onclick = () => newJobPrompt(id));
  await loadJobs(id);
}

async function loadJobs(missionId) {
  const d = await api("GET", "/api/jobs");
  const jobs = (d.jobs || []).filter((j) => j.mission_id === missionId);
  const el = $("jobs");
  el.innerHTML = "";
  jobs.forEach((j) => {
    const div = document.createElement("button");
    div.type = "button";
    div.className = "item";
    div.innerHTML = `<span class="t">${j.title}</span>
      <span class="m">${badge(j.state)} · ${j.executor} · ${t("job.attempt")} ${j.attempt_no}</span>`;
    div.onclick = () => showJob(j);
    el.appendChild(div);
  });
}

function showJob(j) {
  selectedJob = j;
  $("job-card").style.display = "block";
  renderJobDetail(j.id).catch((e) => toast(t("err.prefix") + e.message));
}

async function renderJobDetail(jobId) {
  const j = await api("GET", "/api/jobs/" + jobId);
  const actions = [];
  if (j.state === "proposed") {
    actions.push(`<button class="primary" onclick="requestApproval('${j.id}')">${t("job.requestApproval")}</button>`);
  }
  if (j.state === "approved") {
    actions.push(`<button class="primary" onclick="dispatchJob('${j.id}')">${t("job.dispatch")}</button>`);
  }
  if (j.state === "interrupted_unknown") {
    actions.push(`<button class="bad" onclick="reconcileJob('${j.id}')">${t("job.reconcile")}</button>`);
  }
  if (j.state === "awaiting_approval") {
    actions.push(`<span class="muted">${t("job.awaitingHuman")}</span>`);
  }

  let evidenceHtml = "";
  if (["completed_verified", "completed_unverified", "failed", "interrupted_unknown"].includes(j.state)) {
    try {
      const ev = await api("GET", `/api/jobs/${j.id}/evidence`);
      if (ev.evidence) {
        evidenceHtml = `
          <h2 style="margin-top:12px">${t("job.evidence")} (${t("job.eventNo")} #${ev.event_seq})</h2>
          <div class="muted">${t("job.reportStatus")} ${escapeHtml(ev.kind)}</div>
          <h2 style="margin-top:8px">${t("job.testReport")}</h2>
          <pre class="detail">${escapeHtml(ev.evidence.test_report) || t("job.noTestReport")}</pre>
          <h2 style="margin-top:8px">${t("job.diff")}</h2>
          <pre class="detail">${escapeHtml(ev.evidence.diff)}</pre>`;
      } else {
        evidenceHtml = `<div class="muted" style="margin-top:8px">${escapeHtml(ev.note || t("job.noEvidence"))}</div>`;
      }
    } catch (e) {
      evidenceHtml = `<div class="muted" style="margin-top:8px">${t("job.evidenceFailed")} ${escapeHtml(e.message)}</div>`;
    }
  }

  $("job-detail").innerHTML = `
    <div class="row-inline"><b>${escapeHtml(j.title)}</b> ${badge(j.state)}
      <span class="muted">${escapeHtml(j.id)}</span></div>
    <div class="muted" style="margin-top:6px">
      ${t("job.executor")}: ${escapeHtml(j.executor)} · ${t("job.attempt")}: ${j.attempt_no} ·
      manifest: <code>${escapeHtml(String(j.manifest_hash).slice(0, 12))}…</code>
    </div>
    <div class="muted">${t("job.command")} ${escapeHtml(j.command) || "—"}</div>
    <div class="muted">${t("job.paths")} ${escapeHtml((j.workspace_paths || []).join(", "))} ·
      ${t("job.actions")} ${escapeHtml((j.actions || []).join(", "))}</div>
    <div class="row-inline" style="margin-top:10px">${actions.join("")}</div>
    ${evidenceHtml}`;
}

async function requestApproval(jobId) {
  try {
    await api("POST", "/api/approvals", { job_id: jobId });
    toast(t("toast.approvalRequested")); refresh();
  } catch (e) { toast(t("err.prefix") + e.message); }
}

async function activateMission(id) {
  try {
    await api("POST", "/api/missions/" + id + "/activate");
    toast(t("toast.missionActivated")); refresh();
  } catch (e) { toast(t("err.prefix") + e.message); }
}

async function dispatchJob(jobId) {
  try {
    const r = await api("POST", "/api/jobs/" + jobId + "/dispatch");
    toast(t("toast.dispatchResult") + r.receipt.final_state);
    refresh();
  } catch (e) { toast(t("err.prefix") + e.message); }
}

async function reconcileJob(jobId) {
  const state = prompt(t("prompt.finalState"), "failed");
  if (!state) return;
  try {
    await api("POST", "/api/jobs/" + jobId + "/reconcile", { final_state: state, note: t("reconcile.note") });
    toast(t("toast.reconciled")); refresh();
  } catch (e) { toast(t("err.prefix") + e.message); }
}

function newJobPrompt(missionId) {
  const title = prompt(t("prompt.jobTitle"));
  if (!title) return;
  const executor = prompt(t("prompt.executor"), "fake-executor");
  const actions = prompt(t("prompt.actions"), "read_file,run_tests");
  propose(missionId, title, executor, actions.split(",").map(s=>s.trim()));
}

async function propose(missionId, title, executor, actions) {
  try {
    const j = await api("POST", "/api/jobs", {
      mission_id: missionId, title, executor,
      workspace_paths: ["workspace/"], actions,
      proposed_by: "planner",
    });
    // auto-request approval
    const a = await api("POST", "/api/approvals", { job_id: j.id });
    toast(t("toast.jobProposed"));
    refresh();
  } catch (e) { toast(t("err.prefix") + e.message); }
}

async function loadApprovals() {
  const d = await api("GET", "/api/approvals");
  const el = $("approvals");
  el.innerHTML = "";
  const pending = (d.approvals || []).filter((a) => a.decision === "requested");
  if (pending.length === 0) { el.innerHTML = `<div class="muted">${t("approvals.none")}</div>`; return; }
  pending.forEach((a) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<div class="t">${t("approvals.forJob")} <span class="muted">${a.job_id}</span></div>
      <div class="m">scope: ${a.scope.executor} · ${(a.scope.actions||[]).join(", ")}</div>
      <div class="row-inline" style="margin-top:6px">
        <button class="ok" onclick="decide('${a.id}','granted')">${t("approvals.grant")}</button>
        <button class="bad" onclick="decide('${a.id}','denied')">${t("approvals.reject")}</button>
      </div>`;
    el.appendChild(div);
  });
}

function reasonText(reason, fallback) {
  switch (reason) {
    case "not_absolute": return t("err.not_absolute");
    case "traversal": return t("err.traversal");
    case "outside_scope": return t("err.outside_scope");
    case "missing": return t("err.missing");
    case "not_a_directory": return t("err.not_a_directory");
    case "not_readable": return t("err.not_readable");
    case "symlink_escapes_scope": return t("err.symlink_escapes_scope");
    case "windows_unsupported": return t("err.windows_unsupported");
    case "scope_unset": return t("err.scope_unset");
    case "duplicate": return t("err.duplicate");
    default: return fallback;
  }
}

async function loadProjects() {
  const d = await api("GET", "/api/projects");
  const el = $("proj-list");
  el.innerHTML = "";
  const rows = d.projects || [];
  if (rows.length === 0) {
    el.innerHTML = `<div class="muted">${t("ui.noProjects")}</div>`;
    return;
  }
  rows.forEach((p) => {
    const div = document.createElement("div");
    div.className = "item";
    const badges = [
      p.is_symlink ? t("ui.symlink") : "",
      p.read_only ? t("ui.readOnly") : "",
    ].filter(Boolean).join(" · ");
    div.innerHTML = `<div class="t">${p.name}</div>
      <div class="m">${p.canonical_root}</div>
      ${badges ? `<div class="m">${badges}</div>` : ""}`;
    el.appendChild(div);
  });
}

function _labelProjectForm() {
  $("proj-name").setAttribute("aria-label", t("ui.name"));
  $("proj-name").placeholder = t("ui.name");
  $("proj-root").setAttribute("aria-label", t("ui.root"));
  $("proj-root").placeholder = t("ui.rootPlaceholder");
  $("proj-env").setAttribute("aria-label", t("ui.environment"));
  $("proj-add").textContent = t("ui.register");
}

$("proj-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const msg = $("proj-msg");
  msg.textContent = "";
  try {
    await api("POST", "/api/projects", {
      name: $("proj-name").value.trim(),
      environment: $("proj-env").value,
      root: $("proj-root").value.trim(),
    });
    $("proj-root").value = "";
    toast(t("ui.registered"));
    await loadProjects();
  } catch (e) {
    msg.textContent = reasonText(e.reason, _errText(e));
  }
});

async function decide(approvalId, decision) {

  try {
    await api("POST", "/api/approvals/" + approvalId + "/decide", { decision });
    toast(decision === "granted" ? t("toast.approved") : t("toast.denied"));
    refresh();
  } catch (e) { toast(t("err.prefix") + e.message); }
}

async function loadFeed() {
  const d = await api("GET", "/api/events");
  const el = $("feed");
  el.innerHTML = "";
  (d.events || []).slice().reverse().forEach((e) => {
    const div = document.createElement("div");
    div.className = "row";
    const ts = new Date(e.ts).toLocaleTimeString(localeFor());
    div.innerHTML = `<span class="ts">${ts}</span><span class="seq">#${e.seq}</span> <span class="kind">${e.kind}</span>`;
    el.appendChild(div);
  });
  if (!el.children.length) el.innerHTML = `<div class="muted">${t("feed.empty")}</div>`;
}

async function refresh() {
  try {
    await Promise.all([
      loadStatus(), loadMissions(), loadApprovals(),
      loadFeed(), loadProjects(),
    ]);
    DATA_ON_SCREEN = true;
    if (selectedMission) loadMissionDetail(selectedMission.id);
    if (selectedJob) {
      renderJobDetail(selectedJob.id).catch((e) =>
        uiLog("error", "job detail re-render failed", { detail: _errText(e) }));
    }
  } catch (e) {
    // Was `/* auth or transient *\/`: a failed refresh left no trace.
    uiLog("error", "refresh failed", { detail: _errText(e) });
  }
}

window.decide = decide;
window.requestApproval = requestApproval;
window.dispatchJob = dispatchJob;
window.reconcileJob = reconcileJob;

// loadLang() owns the storage key, validates the stored value and survives a
// disabled localStorage, so boot needs no guard of its own.
setLang(loadLang());
applyI18n();
if (typeof _labelProjectForm === "function") _labelProjectForm();
$("diag-clear").addEventListener("click", uiLogClear);
$("btn-connect").onclick = async () => { await connect(); refresh(); };
$("lang-select").addEventListener("change", (e) => {
  setLang(e.target.value);
  toast(t("ui.saved"));
});
$("btn-mission").onclick = async () => {
  const title = $("new-mission").value.trim();
  if (!title) return;
  try { await api("POST", "/api/missions", { title }); $("new-mission").value = ""; toast(t("toast.missionCreated")); refresh(); }
  catch (e) { toast(t("err.prefix") + e.message); }
};

(async () => {
  if (TOKEN) {
    try {
      await refresh();
    } catch (e) {
      uiLog("error", "initial load failed", { detail: _errText(e) });
    }
  }
  else { $("conn").textContent = t("conn.needToken"); }
  setInterval(() => { if (TOKEN) refresh(); }, 4000);
})();
</script>
</body>
</html>
